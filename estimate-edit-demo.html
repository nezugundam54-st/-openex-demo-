    const anyInDom = [...document.querySelectorAll('#kojiBody .koji-chk')].some(cb => cb.checked);
    const anyHidden = [..._kojiCheckedOverrides.values()].some(v => v === true);
    document.getElementById('kojiSaveBtn')?.classList.toggle('disabled', !(anyInDom || anyHidden));
  }

  /* ツリー開閉・行選択のイベント委譲は#cadBody/#kojiBody（静的に存在するコンテナ）に一度だけ登録する。 */
  document.getElementById('cadBody').addEventListener('click', e => {
    const arrowEl = e.target.closest('.arrow[data-toggle]');
    if (arrowEl) {
      const id = arrowEl.dataset.toggle;
      const tr = arrowEl.closest('tr');
      const collapse = !tr.classList.contains('collapsed');
      tr.classList.toggle('collapsed', collapse);
      _cadTreeToggleChildren(document.getElementById('cadMasterTable'), id, collapse);
      return;
    }
    const hbtn = e.target.closest('[data-hikidashi-idx]');
    if (hbtn) {
      const leaf = _cadPreviewLeaves[parseInt(hbtn.dataset.hikidashiIdx, 10)];
      if (!leaf) return;
      const active = hbtn.classList.toggle('active');
      // バグ修正（2026-07-28）: 従来はDOM表示(name-text)の切替のみでleaf側に何も残さなかったため、
      // applyCadImport()の保存処理がこのトグル状態を一切参照できなかった（「採用」を押しても保存結果は
      // 常にマスタ引当名／RIKCAD材料名フォールバックのまま、というオーナー指摘の既存ギャップ）。
      // leaf._hikidashiAdoptedに真偽値として残し、applyCadImport()の名称解決で参照する。
      leaf._hikidashiAdopted = active;
      const nameSpan = hbtn.closest('tr').querySelector('.name-text');
      if (nameSpan) {
        nameSpan.textContent = active
          ? (leaf.hikidashi || '')
          : (leaf.matchedRow ? (leaf.matchedRow.name || '') : `${leaf.cadName}（未登録）`);
        nameSpan.classList.toggle('override', active);
      }
    }
  });
  document.getElementById('cadBody').addEventListener('change', e => {
    // 2026-07-28〜: 「合算」チェック(.cad-merge-chk)のchangeでの自動集計はオーナー指示で廃止。
    // チェックは単なる選択状態としてのみ保持し、小計行の追加・再計算・削除は画面下部の
    // 「合算」ボタン(_cadApplyAllSubtotals)を押した時にのみ行う。
    if (e.target.classList.contains('cad-subtotal-chk')) {
      _cadSyncSubtotalExclusivity(e.target.dataset.group);
    }
  });

  document.getElementById('kojiBody').addEventListener('click', e => {
    const arrowEl = e.target.closest('.arrow[data-toggle]');
    if (arrowEl) {
      const id = arrowEl.dataset.toggle;
      const tr = arrowEl.closest('tr');
      const collapse = !tr.classList.contains('collapsed');
      tr.classList.toggle('collapsed', collapse);
      _cadTreeToggleChildren(document.getElementById('kojiMasterTable'), id, collapse);
      return;
    }
    const row = e.target.closest('tr');
    if (row && e.target.type !== 'checkbox') {
      const cb = row.querySelector('.koji-chk');
      if (!cb) return; // フォルダ行は選択不可
      cb.checked = !cb.checked;
      _kojiCheckedOverrides.set(String(cb.dataset.rowId), cb.checked);
      syncKojiRow(row);
      updateKojiSelectButton();
    }
  });
  document.getElementById('kojiBody').addEventListener('change', e => {
    if (e.target.classList.contains('koji-chk')) {
      _kojiCheckedOverrides.set(String(e.target.dataset.rowId), e.target.checked);
      syncKojiRow(e.target.closest('tr'));
      updateKojiSelectButton();
    }
  });

  function closeKojiOverlay() {
    document.getElementById('kojiOverlay').classList.remove('open');
  }

  async function saveKojiLinks() {
    if (_kojiTargetIdx < 0) return;
    const rikcadName = (_cadItems[_kojiTargetIdx]?.name || '').trim();
    const btn = document.getElementById('kojiSaveBtn');
    if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }

    /* バグ修正（2026-07-28）: 保存後にrenderCadImportTable()をフル再描画すると、既存の合算チェック(.cad-merge-chk)・
       表示中だった小計行が無条件でリセットされてしまう。再描画前に「合算」チェックON状態の行を安定キーで退避し、
       再描画後に同じ行を見つけてチェックを戻す。
       同日追記（合算方式の再改訂に伴う調整）: 小計行の生成は「合算」ボタン押下時のみという新方式のため、
       ここでの復元は「保存前に実際に表示されていた小計行」に限定する。単にチェックが2件以上残っている
       というだけでは復元しない（そうしないと、工事選択の保存を経由するだけで自動的に小計行が湧いて出る
       ことになり、「自動集計はしない」という新方式の原則が保存フロー経由で骨抜きになってしまうため）。
       「保存前に表示されていた小計行」の同一性は、その小計行を構成していたメンバーの安定キー集合が
       再描画後も一致するかどうかで判定する（グループIDそのものは再描画のたびに振り直されるため使えない）。 */
    const _preservedMergeKeys = new Set();
    document.querySelectorAll('.cad-merge-chk:checked').forEach(chk => {
      const leaf = _cadPreviewLeaves[parseInt(chk.dataset.leafIdx, 10)];
      if (leaf) _preservedMergeKeys.add(_cadLeafStableKey(leaf));
    });
    const _preservedSubtotalGroupKeys = new Set();
    document.querySelectorAll('tr[data-subtotal-group]').forEach(row => {
      const data = _cadComputeSubtotal(row.dataset.subtotalGroup);
      if (!data) return;
      _preservedSubtotalGroupKeys.add(data.checkedLeaves.map(_cadLeafStableKey).sort().join('|'));
    });

    // 検索フィルタで画面から一時的に消えた行の選択操作も取りこぼさないよう、DOM上のチェックボックスではなく
    // ユーザーが実際にトグルした全行の記録(_kojiCheckedOverrides)を保存対象にする。
    let errCount = 0;
    for (const [rowIdStr, checked] of _kojiCheckedOverrides.entries()) {
      const row = _cadAllMasterRows.find(r => String(r.id) === rowIdStr);
      if (!row) continue;
      const existing = (row.rikcad_name || '').split(',').map(s => s.trim()).filter(Boolean);
      const hasIt = existing.includes(rikcadName);
      let newList = [...existing];
      if (checked && !hasIt) { newList.push(rikcadName); }
      else if (!checked && hasIt) { newList = newList.filter(s => s !== rikcadName); }
      else { continue; }

      const newVal = newList.join(',');
      try {
        const res = await fetch(`${API}/master_rows?id=eq.${row.id}`, {
          method: 'PATCH', headers: HEADERS, body: JSON.stringify({ rikcad_name: newVal })
        });
        if (res.ok) { row.rikcad_name = newVal; }
        else errCount++;
      } catch(e) { errCount++; }
    }

    closeKojiOverlay();
    alert(errCount > 0 ? `${errCount}件の保存に失敗しました` : '工事との紐づけを保存しました');
    renderCadImportTable();

    // 退避した安定キーに一致する行を新しいDOM(_cadPreviewLeaves)上で探し、合算チェックを再度ONに戻す。
    // 一致する行が見つからない（工事選択の結果、マスタ引当が変わった等）場合は復元しない＝新しい状態を正とする。
    if (_preservedMergeKeys.size) {
      const affectedGroups = new Set();
      document.querySelectorAll('.cad-merge-chk').forEach(chk => {
        const leaf = _cadPreviewLeaves[parseInt(chk.dataset.leafIdx, 10)];
        if (leaf && _preservedMergeKeys.has(_cadLeafStableKey(leaf))) {
          chk.checked = true;
          affectedGroups.add(chk.dataset.group);
        }
      });
      // 小計行の再表示は、保存前に実際に表示されていたもの（_preservedSubtotalGroupKeysに一致するもの）のみ。
      affectedGroups.forEach(groupId => {
        const data = _cadComputeSubtotal(groupId);
        if (!data) return;
        const key = data.checkedLeaves.map(_cadLeafStableKey).sort().join('|');
        if (_preservedSubtotalGroupKeys.has(key)) _cadUpdateSubtotal(groupId);
      });
    }
  }

  /* 「引用」確定時: 選択したCADプレビュー行をestimate_rowsとしてSupabaseへ直接INSERTし、再読込する。
     移植元(.htm_)はメモリ上のtreeへ追加→後で「登録」ボタンでまとめて保存する方式だが、現行ファイルには
     そのようなツリー編集モデル・保存フローが無い（登録ボタンも未結線）ため、選択直後にDB反映→再取得表示
     する方式に変更している（secretary/notes/2026-07-27-decisions.md参照）。 */
  let _cadApplyInProgress = false; // 二重送信防止（「引用」ボタン連打・二重クリック対策、2026-08-04追記。詳細はdebug-log参照）
  async function applyCadImport() {
    if (!currentEstimateId) { alert('見積を登録してから「CADから引用」をご利用ください'); return; }
    // fetch完了(POST→loadRealData()での_lastDbRows更新)前に連打されると、_cadFindOrCreateDestFolder()の
    // 既存フォルダ検索がどちらの呼び出しからも「まだ存在しない」と判定してしまい、同じフォルダ・同じ明細が
    // 2セットずつ作られてしまう（2026-08-04、坂東さん報告の「同じマスタ階層が2つ表示される」不具合の原因）。
    // フラグ＋ボタンdisableの二重ガードで、処理完了までは追加の「引用」実行を受け付けないようにする。
    if (_cadApplyInProgress) return;
    _cadApplyInProgress = true;
    const _cadApplyBtn = document.getElementById('btnCadApply');
    if (_cadApplyBtn) _cadApplyBtn.disabled = true;
    try {

    // 小計行の引用チェック(.cad-subtotal-chk)がONのグループを先に洗い出す。
    // _cadComputeSubtotal()は画面表示(_cadUpdateSubtotal)と同一の計算関数（重複ロジック排除、2026-07-27）。
    const subtotalGroups = [...document.querySelectorAll('.cad-subtotal-chk:checked')]
      .map(chk => ({ groupId: chk.dataset.group, data: _cadComputeSubtotal(chk.dataset.group) }))
      .filter(g => g.data);

    // 二重計上防止（最優先事項）: 小計に含まれるメンバーのleafIdxは、通常の.cad-chk収集から必ず除外する。
    // 画面上は_cadSyncSubtotalExclusivityが該当行の.cad-chkを自動OFFにしているはずだが、
    // それに依存せずここでも明示的に除外し、二重計上が起きない設計を保証する。
    const excludedLeafIdx = new Set();
    subtotalGroups.forEach(g => g.data.checkedLeafIdxs.forEach(i => excludedLeafIdx.add(i)));

    const checked = [...document.querySelectorAll('.cad-chk:checked')]
      .filter(chk => !excludedLeafIdx.has(parseInt(chk.dataset.leafIdx, 10)));

    if (!checked.length && !subtotalGroups.length) { alert('行を選択してください'); return; }

    const target = _cadResolveTargetFolder();
    const newRows = [];

    // ---- マスタ側の所属階層（大項目/中項目フォルダ）を見積側に再現するためのヘルパー群 ----
    // マスタ引き当て(leaf.matchedRow)で得られる明細は、マスタ上ではフォルダ(cat/subcat)にぶら下がっていたが、
    // 従来はそのフォルダ情報を捨てて全件_cadResolveTargetFolder()の単一フォルダに平置きしていた。
    // ここでは leaf.matchedRow.parent_id からマスタ側のフォルダ階層を辿り、同名のフォルダを見積側で
    // 探す/無ければ新規作成して、その配下に明細を挿入する。

    // parentFolderId配下（既存行_lastDbRows＋今回のimportで積んだnewRows）の次のsort_orderを返す
    function _cadNextSortOrder(parentFolderId) {
      const siblings = _lastDbRows.concat(newRows).filter(r => (r.parent_id || null) === (parentFolderId || null));
      return siblings.reduce((mx, r) => Math.max(mx, r.sort_order || 0), -1) + 1;
    }
    // 見積側の既存フォルダ＋今回のimport内で新規作成したフォルダの両方から、同じ階層(row_type+name+親)を探す。
    // 無ければ新規作成してnewRowsに積む（folder_idはgenFolderId()でクライアント側発行のため、同一POSTバッチ内で
    // そのまま親子付けできる。既存の「階層追加」(insertTierRow)と同じ_opBlankRowで列構成を揃える）。
    function _cadFindOrCreateDestFolder(rowType, name, parentFolderId, level) {
      const pool = _lastDbRows.concat(newRows);
      const found = pool.find(r => r.row_type === rowType && r.name === name && (r.parent_id || null) === (parentFolderId || null));
      if (found) return found;
      const folder = _opBlankRow({
        row_type: rowType, level, folder_id: genFolderId(), parent_id: parentFolderId,
        sort_order: _cadNextSortOrder(parentFolderId), name,
      });
      newRows.push(folder);
      return folder;
    }
    // マスタ側でmatchedRowが所属していたフォルダ階層を、_cadAllMasterRowsのparent_idを辿って
    // 大項目(cat)→(あれば)中項目(subcat)の順に並べて返す（master_rowsもcat/subcat/rowの3段固定モデルのため
    // 配列は最大2件）。
    function _cadMasterFolderChain(matchedRow) {
      const chain = [];
      let parentId = matchedRow && matchedRow.parent_id;
      while (parentId) {
        const folder = _cadAllMasterRows.find(r => r.row_type !== 'row' && r.folder_id === parentId);
        if (!folder) break;
        chain.unshift(folder);
        parentId = folder.parent_id;
      }
      return chain;
    }
    // leafが所属していたマスタの階層(cat→subcat)を見積側に同名フォルダとして見つける/作り、その挿入先を返す。
    // マスタ未マッチ・マスタ側にフォルダ情報が無い場合はnull（呼び出し側で従来通りtarget=_cadResolveTargetFolder()に
    // フォールバックする）。
    function _cadResolveHierarchyTarget(leaf) {
      if (!leaf || !leaf.matchedRow) return null;
      const chain = _cadMasterFolderChain(leaf.matchedRow);
      if (!chain.length) return null;
      let parentFolderId = null, folder = null;
      chain.forEach((mFolder, i) => {
        folder = _cadFindOrCreateDestFolder(i === 0 ? 'cat' : 'subcat', mFolder.name, parentFolderId, i + 1);
        parentFolderId = folder.folder_id;
      });
      return { folderId: folder.folder_id };
    }

    checked.forEach(chk => {
      const leaf = _cadPreviewLeaves[parseInt(chk.dataset.leafIdx, 10)];
      if (!leaf) return;
      const m = leaf.matchedRow;
      // マスタ引当あり(m!==null)の明細は、マスタ上の所属フォルダ(cat/subcat)を見積側に再現してその配下へ挿入する。
      // 引当なし（マスタ未登録／階層情報なし）の明細は、従来通り_cadResolveTargetFolder()のフォールバック先へ。
      const dest = _cadResolveHierarchyTarget(leaf) || target;
      // マスタ未登録(m===null)の場合は、名称にCAD側のRIKCAD材料名をそのまま反映する（既存フォールバック仕様）。
      // バグ修正（2026-07-28）: 「引出線名称」の「採用」トグル(leaf._hikidashiAdopted)がONの行は、
      // マスタ引当名／RIKCAD材料名フォールバックより優先して引出線名称(leaf.hikidashi)を保存する。
      // トグルがOFF（既定）の場合は従来どおりのフォールバックのまま。
      const adoptedName = (leaf._hikidashiAdopted && leaf.hikidashi) ? leaf.hikidashi : null;
      newRows.push({
        estimate_id: currentEstimateId,
        row_type: 'row',
        folder_id: null,
        parent_id: dest ? dest.folderId : null,
        // 明細行(row_type:'row')のlevelは常に3固定（isFolder判定=level!==3、insertLeafRow等と同じ規約。
        // フォルダの深さ=1/2に関わらず不変）。
        level: 3,
        sort_order: _cadNextSortOrder(dest ? dest.folderId : null),
        name: adoptedName || (m ? (m.name || '') : (leaf.cadName || '')),
        spec: leaf.spec || null,
        qty: (leaf.qty != null && leaf.qty !== '') ? Number(leaf.qty) : null,
        unit: leaf.unit || null,
        // 2026-08-04追加（坂東さん指示、engineering/debug-log/2026-08-04-cad-import-kakaku-not-reflected.md
        // 参照）: マスタ未マッチ(m===null)の明細に限り、価格検索で得たitem.kakaku（金額）を
        // 「定価」列にそのまま反映する（数量で割った単価換算はしない、との明示指示）。マスタ引当が
        // ある明細は従来通りマスタの定価を優先し、kakakuでは上書きしない（開発部の見立て＝安全側の
        // デフォルトとして坂東さんに承認済み）。定価(list_price)は下部集計(computeAgg())の
        // 原価率・粗利率・客出し金額の計算には使われない列のため、金額をそのまま入れても
        // 数量×単価ベースの他の金額計算を狂わせない（選定理由、詳細は上記デバッグログ参照）。
        // kakakuが0（=価格検索でヒットしなかった場合の既定値）の場合は「値なし」として扱いnullのまま。
        list_price: (m && m.list_price != null) ? Number(m.list_price) : (leaf.kakaku > 0 ? leaf.kakaku : null),
        rate: (m && m.rate != null) ? Number(m.rate) : null,
        unit_price: (m && m.customer_unit_price != null) ? Number(m.customer_unit_price) : null,
        cost: (m && m.unit_price != null) ? Number(m.unit_price) : null,
        craftsman_unit_price: (m && m.craftsman_unit_price != null) ? Number(m.craftsman_unit_price) : null,
        bone_unit_price: (m && m.bone_unit_price != null) ? Number(m.bone_unit_price) : null,
        order_wholesale_name: (m && m.order_wholesale_name) || null,
        order_craftsman_name: (m && m.order_craftsman_name) || null,
        memo: (m && m.line_remark) || null,
        note: leaf.cadName || null,
      });
    });

    // 合算（小計）行: 1グループにつき1行、数量合計・単価・金額を反映する。
    // 2026-08-05修正（坂東さん指摘、011.jpg）: 問屋材仕入れ（cost）・職人手間（craftsman_unit_price）・
    // 骨材料等（bone_unit_price）も、_cadComputeSubtotalが算出した実効単価（合算対象メンバーの
    // 単価×数量を積み上げた金額÷合計数量）を反映するよう変更した（従来はnull固定＝空欄だった）。
    // 発注先・社内メモ・定価・掛率は、合算対象で発注先等が食い違いうる・定価は元々合算方針の対象外
    // （list_price合算は別途検討事項）のため、引き続きnullのまま挿入する。
    // 挿入先の階層は、グループ内でマスタに一致した代表行（無ければ先頭行）の所属フォルダを使う
    // （合算対象は基本的に同一マスタ行＝同一フォルダのはずだが、複数マスタにまたがる場合も代表1件に統一する）。
    subtotalGroups.forEach(g => {
      const { data } = g;
      const nameLeaf = data.checkedLeaves.find(l => l.matchedRow) || data.checkedLeaves[0];
      const dest = _cadResolveHierarchyTarget(nameLeaf) || target;
      newRows.push({
        estimate_id: currentEstimateId,
        row_type: 'row',
        folder_id: null,
        parent_id: dest ? dest.folderId : null,
        level: 3,
        sort_order: _cadNextSortOrder(dest ? dest.folderId : null),
        name: data.name,
        spec: null,
        qty: data.qtySum,
        unit: data.unit || null,
        list_price: null,
        rate: null,
        unit_price: data.uprice,
        cost: data.cost,
        craftsman_unit_price: data.craftsman,
        bone_unit_price: data.bone,
        order_wholesale_name: null,
        order_craftsman_name: null,
        memo: null,
        note: [...new Set(data.checkedLeaves.map(l => l.cadName).filter(Boolean))].join(', ') || null,
      });
    });
    if (!newRows.length) { alert('挿入できる行がありません'); return; }

    try {
      const res = await fetch(`${API}/estimate_rows`, { method: 'POST', headers: HEADERS, body: JSON.stringify(newRows) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
    } catch (e) {
      alert('見積行の追加に失敗しました: ' + e.message);
      return;
    }

    closeCadOverlay();
    await loadRealData(currentEstimateId, currentPropertyId);
    alert(`${newRows.length}行を追加しました`);
    } finally {
      _cadApplyInProgress = false;
      if (_cadApplyBtn) _cadApplyBtn.disabled = false;
    }
  }

  /* 「引用」の挿入先フォルダを決定する: 選択中の行(selectedRowId)がフォルダならそのfolder_id、
     明細行ならその親フォルダのfolder_id。選択が無い/フォルダが見つからない場合は先頭の大項目(cat)にフォールバックする。 */
  function _cadResolveTargetFolder() {
    if (!_lastDbRows.length) return null;
    let anchor = selectedRowId != null ? _lastDbRows.find(r => String(r.id) === String(selectedRowId)) : null;
    if (anchor) {
      if (anchor.row_type === 'cat' || anchor.row_type === 'subcat') {
        return { folderId: anchor.folder_id, level: anchor.level || 1 };
      }
      if (anchor.parent_id) {
        const folderRow = _lastDbRows.find(r => r.folder_id === anchor.parent_id);
        if (folderRow) return { folderId: folderRow.folder_id, level: folderRow.level || 1 };
      }
    }
    const firstFolder = _lastDbRows.find(r => r.row_type === 'cat') || _lastDbRows.find(r => r.row_type === 'subcat');
    return firstFolder ? { folderId: firstFolder.folder_id, level: firstFolder.level || 1 } : null;
  }

  // ========== 初期表示: estimate_id が付いていれば実データ、無ければデモ表示 ==========
  (function init() {
    setActiveNav('estimate');
    const urlParams = new URLSearchParams(location.search);
    const estimateIdParam = urlParams.get('estimate_id');
    const propertyIdParam = urlParams.get('property_id');
    currentPropertyId = propertyIdParam || null;
    currentEstimateId = estimateIdParam || null;

    if (estimateIdParam) {
