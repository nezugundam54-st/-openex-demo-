<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #ffffff;
    font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "メイリオ", Meiryo, "Yu Gothic UI", Arial, sans-serif;
    color: #303133;
    padding: 68px 24px 90px 24px;
  }

  /* ===== ナビバー（estimate-management.html と同一） ===== */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #fff; border-bottom: 1px solid #e0e0e0;
    display: flex; align-items: stretch; height: 48px; padding: 0 4px;
  }
  .nav-main { display: flex; align-items: stretch; flex: 1; overflow-x: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 5px;
    padding: 0 11px; font-size: 12px; color: #555;
    cursor: pointer; text-decoration: none; white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: 'Noto Sans JP', sans-serif;

  .nav-item:hover { color: #1a6fc4; }

  .nav-item svg { flex-shrink: 0; width: 14px; height: 14px; }
  .nav-item.hacchukanri svg { color: #e53935; }
  .nav-right {
    display: flex; align-items: center;
    margin-left: auto; border-left: 1px solid #e8e8e8; padding-left: 2px; flex-shrink: 0;
  }

  /* ===== ヘッダー（パンくず・タイトル） ===== */
  .breadcrumb { font-size: 13px; margin-bottom: 10px; }
  .breadcrumb .crumb-link { color: #0d8577; font-weight: bold; cursor: pointer; }
  .breadcrumb .crumb-sep { color: #c0c4cc; margin: 0 6px; }
  .breadcrumb .crumb-current { color: #303133; font-weight: bold; }
  .title-row { display: flex; align-items: center; margin-bottom: 16px; }
  h1.page-title { font-size: 22px; font-weight: bold; margin-right: 16px; }
  .info-btn {
    height: 30px;
    padding: 0 14px;
    margin-right: 10px;
    border: 1px solid #c0c4cc;
    border-radius: 15px;
    background-color: #ffffff;
    color: #303133;
    font-size: 12px;
    cursor: pointer;
  }
  .info-btn .info-icon {
    display: inline-block;
    width: 14px; height: 14px;
    line-height: 13px;
    border: 1px solid #909399;
    border-radius: 50%;
    text-align: center;
    font-size: 10px;
    margin-right: 4px;
    color: #909399;
  }

  /* ===== 上部：台帳No./見積No./プラン名/利用テンプレート + 合計サマリー ===== */
  .top-bar { display: flex; flex-direction: row; align-items: flex-start; margin-bottom: 12px; }
  .top-fields { display: flex; flex-direction: row; flex: 1; }
  .field-box { display: flex; flex-direction: column; width: 180px; margin-right: 24px; }
  .field-label { font-size: 12px; color: #303133; margin-bottom: 4px; text-align: center; }
  .field-readonly {
    height: 28px; border: 1px solid #000000; border-radius: 4px;
    display: flex; align-items: center; padding: 0 8px; font-size: 12px;
  }
  .field-input {
    height: 28px; border: 1px solid #DCDFE6; border-radius: 4px;
    padding: 0 8px; font-size: 12px; color: #303133;
  }
  .field-select {
    height: 28px; border: 1px solid #DCDFE6; border-radius: 4px;
    padding: 0 8px; font-size: 12px; color: #303133;
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .field-select::after {
    content: ""; width: 6px; height: 6px;
    border-right: 1px solid #909399; border-bottom: 1px solid #909399;
    transform: rotate(45deg); margin-top: -3px;
  }
  .zero-hide-box { display: flex; flex-direction: column; align-items: center; width: 110px; margin-right: 16px; }
  .zero-hide-label { display: flex; align-items: center; font-size: 13px; }
  .info-icon-circle {
    display: inline-block; width: 14px; height: 14px; line-height: 13px;
    border: 1px solid #909399; border-radius: 50%; text-align: center;
    font-size: 10px; color: #909399; margin-left: 4px; cursor: default;
  }

  table.summary-table {
    border-collapse: separate; border-spacing: 0;
    width: 560px;
  }
  table.summary-table th {
    background-color: #f1faff; color: #1d73cc; font-weight: normal;
    font-size: 12px; height: 26px; border: 1px solid #7f7f7f; text-align: center;
    position: relative;
  }
  table.summary-table td {
    background-color: #ffffff; font-weight: bold; font-size: 13px;
    height: 30px; border: 1px solid #7f7f7f; border-top: none; text-align: center;
  }
  .q-icon {
    display: inline-block; width: 12px; height: 12px; line-height: 11px;
    border: 1px solid #1d73cc; border-radius: 50%; font-size: 9px; color: #1d73cc;
    margin-left: 3px; cursor: default;
  }
  /* 粗利率セル：ソース側で赤枠が明示的に付与されている（強調表示） */
  th.highlight-cell { border-right: 2px solid #ff0000 !important; border-top: 2px solid #ff0000 !important; }
  td.highlight-cell { border-right: 2px solid #ff0000 !important; border-bottom: 2px solid #ff0000 !important; }

  /* ===== テーブル ===== */
  .table-scroll {
    width: 100%;
    overflow-x: auto;
    border: 1px solid #7f7f7f;
  }
  table.main-table {
    border-collapse: separate;
    border-spacing: 0;
    font-size: 11px;
    color: #000000;
    background: #ffffff;
    width: 100%;
  }
  table.main-table th, table.main-table td {
    border-right: 1px solid #7f7f7f;
    border-bottom: 1px solid #7f7f7f;
    background: #ffffff;
    height: 24px;
    padding: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  table.main-table thead th { font-size: 13px; font-weight: bold; text-align: center; height: 22px; }

  th.group {
    background-color: #606266 !important;
    color: #ffffff !important;
    position: relative;
  }
  .fold-btn {
    width: 22px; height: 20px;
    position: absolute;
    left: 2px; top: 1px;
    border: 1px solid #9a9a9a;
    background-color: rgba(255,255,255,.12);
    color: #ffffff;
    font-size: 11px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
  }

  .w-arrow  { width: 26px; min-width: 26px; max-width: 26px; }
  .w-name   { width: 230px; min-width: 230px; }
  .w-spec   { width: 100px; min-width: 100px; }
  .w-qty    { width: 65px; min-width: 65px; }
  .w-unit   { width: 65px; min-width: 65px; }
  .w-price  { width: 90px; min-width: 90px; }
  .w-rate   { width: 55px; min-width: 55px; }
  .w-num    { width: 75px; min-width: 75px; }
  .w-text   { width: 120px; min-width: 120px; }
  .w-order  { width: 95px; min-width: 95px; }
  .w-ph     { width: 25px; min-width: 25px; max-width: 25px; }

  table.main-table td.al { text-align: left; padding: 0 4px; }
  table.main-table td.ar { text-align: right; padding: 0 4px; }
  table.main-table td.ac { text-align: center; }
  table.main-table td.money { background-color: #d9d9d9; }

  .cn { display: inline-block; width: 7px; text-align: center; font-weight: normal; }
  .bold-text { font-weight: bold; }
  .folder { display: inline-block; width: 15px; height: 10px; vertical-align: -1px; margin-right: 2px; }
  .lv1 .folder { margin-left: 3px; }
  .name-cell { display: flex; align-items: center; width: 100%; height: 100%; padding: 0 2px; }
  .name-cell .name-text-wrap { flex: 1; min-width: 0; display: flex; align-items: center; overflow: hidden; }
  .name-cell .name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .arrow {
    display: inline-block;
    width: 6px; height: 6px;
    border-right: 1px solid #606266;
    border-bottom: 1px solid #606266;
    transform: rotate(45deg);
    margin: 0 6px 0 4px;
    cursor: pointer;
    transition: transform .15s;
    flex-shrink: 0;
  }
  tr.collapsed .arrow { transform: rotate(-45deg); }

  tr.selected-row td:not(.money) { background-color: #B3E7FA !important; }
  tbody tr:hover td:not(.money):not(.selected-row td) { cursor: pointer; }

  /* 総計行（下部集計。show-header=falseで本体テーブルに続けて表示） */
  tr.total-label-row td { background-color: #D9D9D9 !important; font-weight: bold; }
  tr.total-row td { font-weight: bold; }
  .sub-label { color: #909399; font-size: 10px; }

  .more-btn {
    flex-shrink: 0;
    width: 18px; height: 18px;
    border: none;
    background: transparent;
    color: #606266;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    letter-spacing: -1px;
  }
  .more-menu {
    position: absolute;
    z-index: 50;
    background: #ffffff;
    border: 1px solid #cfd3d8;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    padding: 4px 0;
    font-size: 12px;
    min-width: 160px;
    display: none;
  }
  .more-menu.open { display: block; }
  .more-menu-item {
    padding: 6px 14px;
    white-space: nowrap;
    cursor: pointer;
    color: #303133;
  }
  .more-menu-item:hover { background: #f5f7fa; }
  .more-menu-item.disabled { color: #c0c4cc; pointer-events: none; }

  .order-select {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: flex-end;
    padding: 0 6px;
    position: relative;
  }
  .order-select::after {
    content: "";
    width: 6px; height: 6px;
    border-right: 1px solid #c0c4cc;
    border-bottom: 1px solid #c0c4cc;
    transform: rotate(45deg);
    margin-top: -3px;
  }

  .ph { display: none; }
  table.fold-tonya    .g-tonya    { display: none; } table.fold-tonya    .ph-tonya    { display: table-cell; }
  table.fold-shokunin .g-shokunin { display: none; } table.fold-shokunin .ph-shokunin { display: table-cell; }
  table.fold-kotsuzai .g-kotsuzai { display: none; } table.fold-kotsuzai .ph-kotsuzai { display: table-cell; }
  table.fold-kyaku    .g-kyaku    { display: none; } table.fold-kyaku    .ph-kyaku    { display: table-cell; }
  table.fold-biko     .g-biko     { display: none; } table.fold-biko     .ph-biko     { display: table-cell; }
  table.fold-arari    .g-arari    { display: none; } table.fold-arari    .ph-arari    { display: table-cell; }
  table.fold-hachu    .g-hachu    { display: none; } table.fold-hachu    .ph-hachu    { display: table-cell; }
  table.fold-memo     .g-memo     { display: none; } table.fold-memo     .ph-memo     { display: table-cell; }
  table.main-table td.ph { background-color: #d9d9d9; }

  /* ===== 下部操作バー ===== */
  .control-strip {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #ffffff;
    border-top: 1px solid #e4e7ed;
    padding: 14px 0;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
  }
  .function-button {
    height: 35px;
    padding: 0 16px;
    border: none;
    border-radius: 12px;
    background-color: #1d73cc;
    color: #fff;
    font-size: 12px;
    margin: 2px 5px;
    cursor: pointer;
  }
  .function-button2 {
    height: 35px;
    padding: 0 16px;
    border: 1px solid #1d73cc;
    border-radius: 12px;
    background-color: #f1faff;
    color: #1d73cc;
    font-size: 12px;
    margin: 2px 5px;
    cursor: pointer;
    position: relative;
  }
  .mini-popover {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 1px solid #cfd3d8;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    padding: 8px;
    display: none;
    white-space: nowrap;
  }
  .mini-popover.open { display: flex; }

  /* ===== CADから引用／工事選択 モーダル（estimate-edit-demo.htm_ 2026-07-24デザイン刷新版から移植） ===== */
  .pbtn{height:30px;padding:0 16px;border-radius:15px;font-size:12px;font-weight:bold;cursor:pointer;border:1px solid #1d73cc;background:#f1faff;color:#1d73cc;}
  .pbtn.primary{background:#1d73cc;color:#fff;border-color:#1d73cc;margin-left:auto;padding:0 26px;}

  .cad-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;align-items:center;justify-content:center;}
  .cad-overlay.open{display:flex;}
  .cad-modal{background:#fff;border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,.3);width:920px;max-width:95vw;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
  .cad-header{padding:12px 16px;border-bottom:1px solid #e4e7ed;display:flex;align-items:center;flex-shrink:0;}
  .cad-title{flex:1;font-size:14px;font-weight:bold;color:#303133;}
  .cad-close{border:none;background:none;font-size:18px;cursor:pointer;color:#909399;padding:0 4px;line-height:1;}
  .cad-close:hover{color:#303133;}
  .cad-body{flex:1;overflow:auto;padding:12px 16px;}
  .cad-footer{padding:10px 16px;border-top:1px solid #e4e7ed;display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}
  .cad-file-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid #ddd;border-radius:5px;margin-bottom:8px;cursor:pointer;}
  .cad-file-item:hover{background:#f0f5ff;border-color:#4a7cc7;}
  /* モーダルフッターのボタンは.pbtn.primaryのmargin-left:autoを打ち消し、隣接配置にする */
  .cad-footer .pbtn{margin-left:0;}

  #cadOverlay .cad-modal{width:1450px;max-width:97vw;background:#eaeaea;}

  #cadOverlay .table-area{width:100%;}
  #cadOverlay .table-scroll{max-height:60vh;overflow:auto;border:1px solid #7f7f7f;background:#fff;}
  #cadOverlay .table-scroll::-webkit-scrollbar{width:6px;height:10px;}
  #cadOverlay .table-scroll::-webkit-scrollbar-track{background-color:#f1f1f1;}
  #cadOverlay .table-scroll::-webkit-scrollbar-thumb{background-color:#c0c0c0;border-radius:6px;}
  #cadOverlay .table-scroll::-webkit-scrollbar-thumb:hover{background-color:#a0a0a0;}

  #cadOverlay thead tr:first-child th{top:0;}

  #cadOverlay .w-arrow{width:25px;min-width:25px;max-width:25px;}
  #cadOverlay .w-check{width:25px;min-width:25px;max-width:25px;}
  #cadOverlay .w-merge{width:25px;min-width:25px;max-width:25px;}
  #cadOverlay .w-koji{width:100px;min-width:100px;max-width:100px;}
  #cadOverlay .w-name{width:180px;min-width:180px;max-width:180px;}
  #cadOverlay .w-spec{width:100px;min-width:100px;max-width:100px;}
  #cadOverlay .w-rikcad{width:110px;min-width:110px;max-width:110px;}
  #cadOverlay .w-hikidashi{width:130px;min-width:130px;max-width:130px;}
  #cadOverlay .w-qty{width:70px;min-width:70px;max-width:70px;}
  #cadOverlay .w-unit{width:70px;min-width:70px;max-width:70px;}
  #cadOverlay .w-price{width:95px;min-width:95px;max-width:95px;}
  #cadOverlay .w-rate{width:55px;min-width:55px;}
  #cadOverlay .w-num{width:75px;min-width:75px;}
  #cadOverlay .w-text{width:120px;min-width:120px;}
  #cadOverlay .w-order{width:100px;min-width:100px;}
  #cadOverlay .w-ph{width:25px;min-width:25px;max-width:25px;}
  #cadOverlay td.al{text-align:left;padding:0 3px;}
  #cadOverlay td.ar{text-align:right;padding:0 3px;}

  // ========== 実データ表示（URLに estimate_id が付いている場合） ==========
  // 参考実装: engineering/fils/estimate-edit-demo.html 502〜645行目付近のIIFE
  // （ツリー構築・集計ロジックを移植。列構成はfils_demoのestimate_rowsスキーマに合わせて拡張）
  async function loadRealData(estimateId, propertyIdParam) {
    try {
      const hr = await fetch(`${API}/estimates?id=eq.${estimateId}`, { headers: HEADERS });
      const hdata = hr.ok ? await hr.json() : [];
      const est = hdata[0];
      if (!est) {
        document.getElementById('bcPlan').textContent = '見積が見つかりません';
        tbody.innerHTML = '<tr><td colspan="30" style="text-align:center;padding:40px 0;color:#bbb;">見積データを取得できませんでした</td></tr>';
        return;
      }

      currentPropertyId = est.property_id || propertyIdParam || null;
      currentEstimateId = estimateId;

      document.getElementById('hfEstNo').value = est.estimate_no || '';
      document.getElementById('hfPlanName').value = est.plan_name || '';
      // 台帳No./利用テンプレートに対応するSupabase列が存在しないため暫定表示
      document.getElementById('hfLedgerNo').textContent = '—';
      document.getElementById('hfTemplate').textContent = '—';
      document.getElementById('bcPlan').textContent = est.plan_name || est.estimate_no || '—';
      document.getElementById('bcProperty').textContent = '—';

      if (currentPropertyId) {
        fetch(`${API}/properties?id=eq.${currentPropertyId}&select=name,customer_id`, { headers: HEADERS })
          .then(r => r.ok ? r.json() : [])
          .then(async d => {
            const prop = d[0];
            if (!prop) return;
            let label = prop.name || '';
            if (prop.customer_id) {
              try {
                const cr = await fetch(`${API}/customers?id=eq.${prop.customer_id}&select=name`, { headers: HEADERS });
                const cd = cr.ok ? await cr.json() : [];
                if (cd[0] && cd[0].name) label = cd[0].name + ' ' + label;
              } catch (e) {}
            }
            document.getElementById('bcProperty').textContent = label || '—';
          })
          .catch(() => {});
      }

      const rr = await fetch(`${API}/estimate_rows?estimate_id=eq.${estimateId}&order=sort_order.asc`, { headers: HEADERS });
      const dbRows = rr.ok ? await rr.json() : [];
      _lastDbRows = dbRows;

      let grandCost = 0, grandCraft = 0, grandBone = 0, grandClient = 0;

      if (!dbRows.length) {
        tbody.innerHTML = '<tr><td colspan="30" style="text-align:center;padding:40px 0;color:#bbb;">明細データがありません</td></tr>';
        rows = [];
      } else {
        const childrenMap = new Map();
        dbRows.forEach(r => {
          const key = r.parent_id || 'root';
          if (!childrenMap.has(key)) childrenMap.set(key, []);
          childrenMap.get(key).push(r);
        });
        childrenMap.forEach(list => list.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)));
        // 子行の parent_id は親行の id ではなく親行の folder_id を参照する
        dbRows.forEach(r => { r._children = (r.folder_id ? childrenMap.get(r.folder_id) : null) || []; });
        const roots = childrenMap.get('root') || [];

        // 原価率・粗利率は「問屋材仕入れ＋職人手間＋骨材料等」の単価合計を基準に算出する
        function computeAgg(row) {
          if (row._children.length) {
            row._children.forEach(computeAgg);
            row._costAmt   = row._children.reduce((s, c) => s + c._costAmt, 0);
            row._craftAmt  = row._children.reduce((s, c) => s + c._craftAmt, 0);
            row._boneAmt   = row._children.reduce((s, c) => s + c._boneAmt, 0);
            row._clientAmt = row._children.reduce((s, c) => s + c._clientAmt, 0);
          } else {
            const qty = num(row.qty);
            row._costAmt   = row.cost != null ? qty * num(row.cost) : 0;
            row._craftAmt  = row.craftsman_unit_price != null ? qty * num(row.craftsman_unit_price) : 0;
            row._boneAmt   = row.bone_unit_price != null ? qty * num(row.bone_unit_price) : 0;
            row._clientAmt = row.unit_price != null ? qty * num(row.unit_price) : 0;
          }
          row._genkaAmt = row._costAmt + row._craftAmt + row._boneAmt;
          row._profit = row._clientAmt - row._genkaAmt;
          row._profitRate = row._clientAmt > 0 ? (row._profit / row._clientAmt * 100) : 0;
          row._costRate = row._clientAmt > 0 ? (row._genkaAmt / row._clientAmt * 100) : 0;
        }
        roots.forEach(computeAgg);
        grandCost   = roots.reduce((s, r) => s + r._costAmt, 0);
        grandCraft  = roots.reduce((s, r) => s + r._craftAmt, 0);
        grandBone   = roots.reduce((s, r) => s + r._boneAmt, 0);
        grandClient = roots.reduce((s, r) => s + r._clientAmt, 0);

        rows = [];
        const bodyFrag = document.createDocumentFragment();

        // ツリーのcn接続線はisLast判定から動的に組み立てる（既存のcn表現を踏襲。完全再現よりも可読性優先）
        function renderNode(row, depth, ancestorLines, isLast, parentNode) {
          const isFolder = row.row_type === 'cat' || row.row_type === 'subcat' || row._children.length > 0;
          const isRoot = depth === 0;
          const cnArr = isRoot ? [] : ancestorLines.concat(isLast ? '└' : '├');
          const childAncestorLines = isRoot ? [] : ancestorLines.concat(isLast ? '　' : '│');
          const cnHtml = cnArr.map(c => '<span class="cn">' + c + '</span>').join('');

          rows.push({ id: row.id, parent: parentNode ? parentNode.id : null, isFolder });

          const tr = document.createElement('tr');
          tr.dataset.id = row.id;
          if (parentNode) tr.dataset.parent = parentNode.id;
          tr.innerHTML =
            '<td class="ac w-arrow">' + (isFolder ? '<span class="arrow" data-toggle="' + row.id + '"></span>' : '') + '</td>' +
            '<td class="al w-name">' +
              '<div class="name-cell">' +
                cnHtml +
                '<div class="name-text-wrap">' +
                  (isFolder ? folderSvg : '') +
                  '<span class="name-text ' + (isFolder ? 'bold-text' : '') + '">' + escHtml(row.name) + '</span>' +
                '</div>' +
                '<button class="more-btn" data-more="' + row.id + '">…</button>' +
              '</div>' +
            '</td>' +
            '<td class="al w-spec">' + (!isRoot ? escHtml(row.spec) : '') + '</td>' +
            '<td class="ar w-qty">' + (!isRoot && row.qty != null ? row.qty : '') + '</td>' +
            '<td class="ac w-unit">' + (!isRoot ? escHtml(row.unit) : '') + '</td>' +
            '<td class="ar w-price">' + (!isRoot ? fmt(row.list_price) : '') + '</td>' +
            '<td class="ar g-tonya">' + (!isFolder && row.rate != null ? row.rate + '%' : '') + '</td>' +
            '<td class="ar g-tonya">' + (!isFolder ? fmt(row.cost) : '') + '</td>' +
            '<td class="ar money g-tonya">' + fmt(row._costAmt) + '</td>' +
            '<td class="ph ph-tonya"></td>' +
            '<td class="ar g-shokunin">' + (!isFolder ? fmt(row.craftsman_unit_price) : '') + '</td>' +
            '<td class="ar money g-shokunin">' + fmt(row._craftAmt) + '</td>' +
            '<td class="ph ph-shokunin"></td>' +
            '<td class="ar g-kotsuzai">' + (!isFolder ? fmt(row.bone_unit_price) : '') + '</td>' +
            '<td class="ar money g-kotsuzai">' + fmt(row._boneAmt) + '</td>' +
            '<td class="ph ph-kotsuzai"></td>' +
            '<td class="ar g-kyaku">' + fmtPct(row._costRate) + '</td>' +
            '<td class="ar g-kyaku">' + (!isFolder ? fmt(row.unit_price) : '') + '</td>' +
            '<td class="ar money g-kyaku">' + fmt(row._clientAmt) + '</td>' +
            '<td class="ph ph-kyaku"></td>' +
            '<td class="al g-biko">' + escHtml(row.memo || '') + '</td>' +
            '<td class="ph ph-biko"></td>' +
            '<td class="ar money g-arari">' + fmt(row._profit) + '</td>' +
            '<td class="ar money g-arari">' + fmtPct(row._profitRate) + '</td>' +
            '<td class="ph ph-arari"></td>' +
            '<td class="g-hachu">' + (!isFolder ? '<div class="order-select">' + escHtml(row.order_wholesale_name || '') + '</div>' : '') + '</td>' +
            '<td class="g-hachu">' + (!isFolder ? '<div class="order-select">' + escHtml(row.order_craftsman_name || '') + '</div>' : '') + '</td>' +
            '<td class="ph ph-hachu"></td>' +
            '<td class="al g-memo">' + escHtml(row.note || '') + '</td>' +
            '<td class="ph ph-memo"></td>';
          bodyFrag.appendChild(tr);

          row._children.forEach((c, i) => renderNode(c, depth + 1, childAncestorLines, i === row._children.length - 1, row));
        }

        roots.forEach((r, i) => renderNode(r, 0, [], i === roots.length - 1, null));
        tbody.innerHTML = '';
        tbody.appendChild(bodyFrag);
      }

      // 中間の集計行（工事合計/現場管理費/一般管理費/改計/端数調整/消費税）は元データがないため省略し、

  tbody.addEventListener("click", e => {
    const moreBtn = e.target.closest("[data-more]");
    if (moreBtn) {
      e.stopPropagation();
      openMoreMenu(moreBtn);
      return;
    }
    const t = e.target.closest("[data-toggle]");
    if (t) {
      e.stopPropagation();
      const id = t.dataset.toggle;
      const tr = t.closest("tr");
      const collapse = !tr.classList.contains("collapsed");
      tr.classList.toggle("collapsed", collapse);
      toggleChildren(id, collapse);
      return;
    }
    const row = e.target.closest("tr");
    if (row && rows.some(rr => rr.id === row.dataset.id)) {
      document.querySelectorAll("#tbody tr.selected-row").forEach(r => r.classList.remove("selected-row"));
      row.classList.add("selected-row");
      selectedRowId = row.dataset.id;
    }
  });
  function toggleChildren(id, collapse) {
    rows.filter(r => r.parent === id).forEach(r => {
      const tr = tbody.querySelector('tr[data-id="' + r.id + '"]');
      tr.style.display = collapse ? "none" : "";
      if (collapse) {
        toggleChildren(r.id, true);
      } else if (!tr.classList.contains("collapsed")) {
        toggleChildren(r.id, false);
      }
    });
  }

  let currentMenu = null;
  function closeMoreMenu() {
    if (currentMenu) { currentMenu.remove(); currentMenu = null; }
  }
  // MENU_ITEMS の1項目をクリックしたときの実処理への振り分け。
  // 「…」行メニュー・下部「操作メニュー」ボタンの両方から同じキーで呼ばれる（targetRowIdは
  // 前者は右クリック対象の行、後者はselectedRowIdを渡す）。実体（cutRow等）は本ファイル末尾寄りの
  // 「操作メニュー」実装セクションで定義（関数宣言のためhoistされ、定義順は問わない）。
  async function runMenuAction(key, targetRowId) {
    switch (key) {
      case "cut":     await cutRow(targetRowId); break;
      case "copy":    copyRow(targetRowId); break;
      case "paste":   await pasteRow(targetRowId); break;
      case "addLine": await insertLeafRow(targetRowId); break;
      case "addTier": await insertTierRow(targetRowId); break;
      case "addItem": await addTopItem(); break;
      case "restore": await restoreEstimate(); break;
      case "delete":  await deleteRowAndDescendants(targetRowId); break;
      default: {
        const item = MENU_ITEMS.find(m => m.key === key);
        notImplemented(item ? item.label : key);
      }
    }
  }
  // メニューDOMの組み立て（「…」行メニュー・下部「操作メニュー」で共用）
  function buildActionMenu(targetRowId, isMain) {
    const menu = document.createElement("div");
    menu.className = "more-menu open";
    MENU_ITEMS.forEach(item => {
      const disabled = (item.mainDisabled && isMain) || (item.pasteGate && !clipboardHasData);
      const div = document.createElement("div");
      div.className = "more-menu-item" + (disabled ? " disabled" : "");
      div.textContent = item.label;
      if (!disabled) {
        div.addEventListener("click", ev => {
          ev.stopPropagation();
          closeMoreMenu();
          runMenuAction(item.key, targetRowId);
        });
      }
      menu.appendChild(div);
    });
    return menu;
  }
  function openMoreMenu(btn) {
    closeMoreMenu();
    const tr = btn.closest("tr");
    const rowId = tr.dataset.id;
    const rowData = rows.find(r => r.id === rowId);
    const isMain = !!(rowData && rowData.isFolder);
    const menu = buildActionMenu(rowId, isMain);
    document.body.appendChild(menu);
    const r = btn.getBoundingClientRect();
    menu.style.left = (window.scrollX + r.left) + "px";
    menu.style.top = (window.scrollY + r.bottom + 2) + "px";
    currentMenu = menu;
  }
  // 下部「操作メニュー」ボタン: 選択中の行(selectedRowId)を対象に「…」行メニューと同じ項目を実行する
  // （estimate-master-edit.htmlのopenOpMenu()と同じ設計。ボタンは画面下部にあるため上向きに開く）。
  function openOperationMenu(anchorBtn) {
    closeMoreMenu();
    if (!selectedRowId) { alert('行が選択されていません'); return; }
    const rowData = rows.find(r => r.id === selectedRowId);
    const isMain = !!(rowData && rowData.isFolder);
    const menu = buildActionMenu(selectedRowId, isMain);
    document.body.appendChild(menu);
    const r = anchorBtn.getBoundingClientRect();
    menu.style.left = (window.scrollX + r.left) + "px";
    menu.style.top = (window.scrollY + r.top - menu.offsetHeight - 4) + "px";
    currentMenu = menu;
  }
  document.getElementById('btnOperationMenu').addEventListener('click', (e) => {
    e.stopPropagation();
    openOperationMenu(e.currentTarget);
  });

  // ========== 「…」メニュー「削除」==========
  // 移植元: engineering/fils_demo/estimate-edit.html_o;d の icDelete()/_collectChildren()（2149〜2180行付近）。
  // 元実装はDOM上の行削除のみ（保存は別途一括保存フローに委ねる設計）だったが、estimate-edit-demo.htmlは
  // 明細をSupabase(estimate_rows)に直接読み書きする設計（CADから引用のPOST等と同じ方針）のため、
  // 削除も選択行確定と同時にSupabaseへ直接反映する（実データ表示時）。フォルダ（大項目/中項目）を
  // 削除する場合は配下の明細も含めて再帰的に削除する（icDeleteの_collectChildrenと同じ考え方だが、
  // こちらはDOMのparentId属性ではなく、renderNode()が構築したrows配列のparent（親行の主キーid、
  // folder_idではない）を辿って再帰収集する）。
  function collectDescendantIds(rowId, acc) {
    acc = acc || [];
    acc.push(rowId);
    rows.filter(r => r.parent === rowId).forEach(r => collectDescendantIds(r.id, acc));
    return acc;
  }
  async function deleteRowAndDescendants(rowId) {
    const idsToDelete = collectDescendantIds(rowId);
    const msg = idsToDelete.length > 1
      ? (idsToDelete.length + ' 行を削除しますか？（フォルダは配下の明細も含めて削除されます）')
      : '1 行を削除しますか？';
    if (!confirm(msg)) return;

    if (currentEstimateId) {
      // 実データ表示時: Supabaseのestimate_rowsから直接DELETEする（50件ずつ、catalog-edit.htmlの
      // 選択削除と同じチャンク方式）。削除後はloadRealData()で再取得し、集計・階層を再構築する。
      try {
        for (let i = 0; i < idsToDelete.length; i += 50) {
          const chunk = idsToDelete.slice(i, i + 50);
          const inStr = chunk.map(id => `"${id}"`).join(',');
          const res = await fetch(`${API}/estimate_rows?id=in.(${inStr})`, {
            method: 'DELETE', headers: HEADERS,
          });
          if (!res.ok) throw new Error('削除に失敗しました');
        }
      } catch (e) {
        alert('削除に失敗しました: ' + (e.message || ''));
        return;
      }
      if (selectedRowId && idsToDelete.includes(selectedRowId)) selectedRowId = null;
      await loadRealData(currentEstimateId, currentPropertyId);
    } else {
      // デモ表示（estimate_id未指定）時はSupabaseに書き込む対象が無いためDOM上のみ削除する
      idsToDelete.forEach(id => {
        const tr = tbody.querySelector('tr[data-id="' + id + '"]');
        if (tr) tr.remove();
      });
      rows = rows.filter(r => !idsToDelete.includes(r.id));
      if (selectedRowId && idsToDelete.includes(selectedRowId)) selectedRowId = null;
    }
  }
  document.addEventListener("click", () => closeMoreMenu());

  // ========== 「操作メニュー」その他の項目（切り取り・コピー・貼り付け・行追加・階層追加・大項目追加・元に戻す） ==========
  // 参考: engineering/docs/estimate/replus/exReplus-Web/exReplus-Web/src/views/estimate/edit/index.vue
  // （onBookEditTableCut/Copy/Paste/onBookEditTableAdditionalLines/onBookEditTableHierarchyAdditionalLines/
  //   onBookEditTableLargeItemAddition/onBookEditRestore）。ただし移植元は「大項目=isMain・最大4階層まで
  // 再帰的にネスト可」という別のツリーモデルかつ複数行選択（同一階層検証つき）を前提にしており、
  // このファイル・fils_demoのestimate_rowsは row_type='cat'(level1固定)/'subcat'(level2固定)/'row'(level3固定)
  // という3段固定の階層モデル（estimate-master-edit.html等と共通）で、選択も1行のみ（selectedRowId）のため、
  // 移植元の「同一階層チェック」「大項目+小項目の混在選択」等の検証ロジックは対象外とし、常に「選択中の
  // 1行（フォルダの場合は配下すべて含む）」を対象に簡略化して実装している。

  // 選択中の行(rowId)を基準に「新しい行の挿入先」を決める。
  // フォルダ(cat/subcat)を選択中 → そのフォルダの末尾の子として追加。
  // 明細行(row)を選択中 → 同じ親の中でその直後に追加。
  function _opResolveInsertTarget(rowId) {
    const row = _lastDbRows.find(r => String(r.id) === String(rowId));
    if (!row) return null;
    const isFolder = row.row_type === 'cat' || row.row_type === 'subcat';
    if (isFolder) {
      const children = _lastDbRows.filter(r => (r.parent_id || null) === row.folder_id);
      const maxSort = children.reduce((mx, r) => Math.max(mx, r.sort_order || 0), -1);
      return { parentFolderId: row.folder_id, afterSortOrder: children.length ? maxSort : null };
    }
    return { parentFolderId: row.parent_id || null, afterSortOrder: row.sort_order != null ? row.sort_order : 0 };
  }
  // parentFolderId配下の兄弟のうち、afterSortOrderより後ろのsort_orderを+1ずつ後ろにずらし、
  // 新規行に割り当てるべきsort_order（＝afterSortOrder+1、afterSortOrderがnullなら0）を返す。
  // sort_orderはint固定（schema_setup.sql）で詰めて並んでいる前提のため、間に割り込ませるにはこの方式が必要。
  async function _opShiftAndGetSortOrder(parentFolderId, afterSortOrder) {
    const siblings = _lastDbRows.filter(r => (r.parent_id || null) === parentFolderId);
    const newSortOrder = (afterSortOrder == null) ? 0 : afterSortOrder + 1;
    const toShift = siblings.filter(r => (r.sort_order || 0) >= newSortOrder);
    for (const r of toShift) {
      await fetch(`${API}/estimate_rows?id=eq.${r.id}`, {
        method: 'PATCH', headers: HEADERS, body: JSON.stringify({ sort_order: (r.sort_order || 0) + 1 }),
      });
    }
    return newSortOrder;
  }
  const OP_ROW_COLUMNS = [
    'row_type', 'level', 'name', 'spec', 'qty', 'unit', 'list_price', 'rate', 'unit_price', 'cost',
    'craftsman_unit_price', 'bone_unit_price', 'order_wholesale_name', 'order_craftsman_name', 'memo', 'note',
  ];
  function _opBlankRow(overrides) {
    const row = { estimate_id: currentEstimateId, folder_id: null, sort_order: 0 };
    OP_ROW_COLUMNS.forEach(c => { row[c] = null; });
    return Object.assign(row, overrides);
  }

  // ---- 行追加 ----
  async function insertLeafRow(rowId) {
    if (!currentEstimateId) { alert('見積を登録してから操作してください'); return; }
    const ctx = _opResolveInsertTarget(rowId);
    if (!ctx) { alert('挿入位置を特定できませんでした'); return; }
    const sortOrder = await _opShiftAndGetSortOrder(ctx.parentFolderId, ctx.afterSortOrder);
    const payload = _opBlankRow({
      row_type: 'row', level: 3, parent_id: ctx.parentFolderId, sort_order: sortOrder, name: '新規行',
    });
    try {
      const res = await fetch(`${API}/estimate_rows`, { method: 'POST', headers: HEADERS, body: JSON.stringify(payload) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
    } catch (e) { alert('行追加に失敗しました: ' + e.message); return; }
    selectedRowId = null;
    await loadRealData(currentEstimateId, currentPropertyId);
  }

  // ---- 階層追加（大項目の下に中項目を追加。大項目以外を選択中の場合は不可） ----
  async function insertTierRow(rowId) {
    if (!currentEstimateId) { alert('見積を登録してから操作してください'); return; }
    const row = _lastDbRows.find(r => String(r.id) === String(rowId));
    if (!row) { alert('行が選択されていません'); return; }
    if (row.row_type !== 'cat') { alert('階層追加は大項目に対してのみ実行できます。'); return; }
    const name = prompt('「階層追加」名を入力してください');
    if (!name) return;
    const ctx = _opResolveInsertTarget(rowId);
    const sortOrder = await _opShiftAndGetSortOrder(ctx.parentFolderId, ctx.afterSortOrder);
    const payload = _opBlankRow({
      row_type: 'subcat', level: 2, folder_id: genFolderId(), parent_id: ctx.parentFolderId,
      sort_order: sortOrder, name,
    });
    try {
      const res = await fetch(`${API}/estimate_rows`, { method: 'POST', headers: HEADERS, body: JSON.stringify(payload) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
    } catch (e) { alert('階層追加に失敗しました: ' + e.message); return; }
    selectedRowId = null;
    await loadRealData(currentEstimateId, currentPropertyId);
  }

  // ---- 大項目追加（選択行によらず常に一覧の末尾に追加。移植元の挿入位置選択(前/後)は省略） ----
  async function addTopItem() {
    if (!currentEstimateId) { alert('見積を登録してから操作してください'); return; }
    const name = prompt('「大項目」名を入力してください');
    if (!name) return;
    if (_lastDbRows.some(r => r.row_type === 'cat' && r.name === name)) {
      alert('その大項目名は既に使用されています。');
      return;
    }
    const roots = _lastDbRows.filter(r => (r.parent_id || null) === null);
    const maxSort = roots.reduce((mx, r) => Math.max(mx, r.sort_order || 0), -1);
    const payload = _opBlankRow({
      row_type: 'cat', level: 1, folder_id: genFolderId(), parent_id: null, sort_order: maxSort + 1, name,
    });
    try {
      const res = await fetch(`${API}/estimate_rows`, { method: 'POST', headers: HEADERS, body: JSON.stringify(payload) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
    } catch (e) { alert('大項目追加に失敗しました: ' + e.message); return; }
    await loadRealData(currentEstimateId, currentPropertyId);
  }

  // ---- 切り取り／コピー／貼り付け ----
  // 選択行＋配下すべて（collectDescendantIds、以前からある「削除」と同じ収集ロジックを再利用）を
  // クリップボードにテンプレートとして保持する。folder_id/parent_idは元の値のまま保持しておき、
  // 実際の新しいfolder_idの発行（genFolderId）は貼り付け時に毎回やり直す。コピーを複数回貼り付けても
  // folder_idが衝突しないようにするため（切り取り時に1回だけ発行して使い回すと、同じクリップボードを
  // 2回貼り付けたときに同一folder_idを持つ行が2組できてしまい、子行の所属があいまいになる）。
  function _opCloneSubtreeRows(rowId) {
    const ids = collectDescendantIds(rowId);
    const dbById = new Map(_lastDbRows.map(r => [String(r.id), r]));
    if (!dbById.has(String(rowId))) return null;
    return ids.map(id => {
      const r = dbById.get(String(id));
      const clone = { isRoot: String(id) === String(rowId), _origFolderId: r.folder_id || null, _origParentId: r.parent_id || null, sort_order: r.sort_order };
      OP_ROW_COLUMNS.forEach(c => { clone[c] = r[c]; });
      return clone;
    });
  }
  function copyRow(rowId) {
    if (!currentEstimateId) { alert('見積を登録してから操作してください'); return; }
    const clones = _opCloneSubtreeRows(rowId);
    if (!clones) return;
    _clipboard = { mode: 'copy', clones };
    clipboardHasData = true;
  }
  async function cutRow(rowId) {
    if (!currentEstimateId) { alert('見積を登録してから操作してください'); return; }
    const clones = _opCloneSubtreeRows(rowId);
    if (!clones) return;
    const idsToDelete = collectDescendantIds(rowId);
    const msg = idsToDelete.length > 1
      ? (idsToDelete.length + ' 行を切り取りますか？（配下の明細も含めて切り取られます）')
      : '1 行を切り取りますか？';
    if (!confirm(msg)) return;
    try {
      for (let i = 0; i < idsToDelete.length; i += 50) {
        const chunk = idsToDelete.slice(i, i + 50);
        const inStr = chunk.map(id => `"${id}"`).join(',');
        const res = await fetch(`${API}/estimate_rows?id=in.(${inStr})`, { method: 'DELETE', headers: HEADERS });
        if (!res.ok) throw new Error('切り取りに失敗しました');
      }
    } catch (e) { alert('切り取りに失敗しました: ' + (e.message || '')); return; }
    _clipboard = { mode: 'cut', clones };
    clipboardHasData = true;
    if (selectedRowId && idsToDelete.includes(selectedRowId)) selectedRowId = null;
    await loadRealData(currentEstimateId, currentPropertyId);
  }
  async function pasteRow(rowId) {
    if (!currentEstimateId) { alert('見積を登録してから操作してください'); return; }
    if (!_clipboard || !_clipboard.clones || !_clipboard.clones.length) {
      alert('コピーまたは切り取りをしてから貼り付けてください');
      return;
    }
    const ctx = _opResolveInsertTarget(rowId);
    if (!ctx) { alert('貼り付け位置を特定できませんでした'); return; }
    const sortOrder = await _opShiftAndGetSortOrder(ctx.parentFolderId, ctx.afterSortOrder);

    // クリップボード内で使われている旧folder_idごとに、貼り付けの都度あらたなfolder_idを発行し直す
    const fidMap = new Map();
    _clipboard.clones.forEach(c => { if (c._origFolderId && !fidMap.has(c._origFolderId)) fidMap.set(c._origFolderId, genFolderId()); });

    const payload = _clipboard.clones.map(c => {
      const row = { estimate_id: currentEstimateId };
      OP_ROW_COLUMNS.forEach(col => { row[col] = c[col]; });
      row.folder_id = c._origFolderId ? fidMap.get(c._origFolderId) : null;
      row.parent_id = c.isRoot ? ctx.parentFolderId : fidMap.get(c._origParentId);
      row.sort_order = c.isRoot ? sortOrder : c.sort_order;
      return row;
    });

    try {
      const res = await fetch(`${API}/estimate_rows`, { method: 'POST', headers: HEADERS, body: JSON.stringify(payload) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
    } catch (e) { alert('貼り付けに失敗しました: ' + e.message); return; }

    // 切り取り→貼り付けは「移動」として扱い、貼り付け後はクリップボードを空にする（同じ内容の
    // 再貼り付け＝複製を防ぐ）。コピーは複数回貼り付けられるよう保持したままにする。
    if (_clipboard.mode === 'cut') { _clipboard = null; clipboardHasData = false; }
    await loadRealData(currentEstimateId, currentPropertyId);
  }

  // ---- 元に戻す ----

  /* ===== CADから引用（estimate-edit-demo.htm_ 2026-07-09〜07-24セッション実装からの移植）=====
     変数名は現行ファイルの命名規則に合わせて置換している: SB→API, H→HEADERS, baseParams.property_id→currentPropertyId。
     toast()は現行ファイルに無いヘルパーのためalert()で代用。escHtml()は上で定義済みのものをそのまま再利用する。
     cadQtyDisplay/cadQtyUnit/getAncestorChain は移植元でも呼び出し箇所が無い未使用関数のため移植していない。 */
  const STORAGE_BASE = `${SUPABASE_URL}/storage/v1/object/public/property-files`;
  let _cadPropertyId = '';
  let _cadFiles      = [];   // property_files レコード
  let _cadItems      = [];

  let _cadMasterItemList = []; // master_items（sort_order順・工事選択の種別プルダウン用）
  let _cadPreviewLeaves = []; // renderCadImportTableで描画中のリーフ行（引用候補）一覧
  let _cadSubtotalAffected = new Map(); // groupId -> [{idx, prevChecked}]。小計チェックONで自動OFFにした個別行の引用チェックの復元用（二重計上防止）
  let _kojiTargetIdx = -1;
  let _kojiFilterMasterId = ''; // 工事種別プルダウンの選択値（''=すべて）
  let _kojiFilterKeyword = ''; // 検索キーワード入力値
  let _kojiCheckedOverrides = new Map(); // rowId(string) -> boolean。検索で行が非表示になっても選択状態を保持するための手動上書き記録

  function esc(v) { return String(v ?? '').replace(/"/g, '&quot;'); }

  // 2026-08-05追加（坂東さん指示）: ifc-viewer.html側のparameters区切りが改行(\n)からカンマ(, )に
  // 変更されたため、旧形式（改行区切り、古いデータ・移行前データとの互換用）も新形式（カンマ区切り）も
  // どちらも1項目ずつに分解できるよう、区切り文字をカンマ・改行のどちらでも分割する共通ヘルパーを追加。
  function splitCadParamSegments(params) {
    return (params || '').split(/[,、\r\n]+/).map(s => s.trim()).filter(Boolean);
  }

  function cadSpec(item) {
    const params = item.parameters || '';
    if ([4,5,6,7].includes(item.type)) {
      const m = params.match(/ﾒｰｶｰ[：:]\s*([^\n\r、,/]+)/);
      return m ? m[1].trim() : '';
    }
    // 2026-08-04追加（坂東さん指示）: オブジェクト系（type 1/3/8＝壁/スラブ/メッシュ/屋根以外）は
    // item.parametersを従来そのまま返していたが、「数量」の行だけは仕様欄から除外してほしいとの
    // 指示に対応。paramPartsの書式（ifc-viewer.htmlのtransferToEstimateBtn、`${paramName}:${text}${unit}`
    // 半角コロン、1026行付近）に基づき、行頭が「数量:」（全角コロンの可能性も念のため許容）の行だけを
    // 取り除く。ﾒｰｶｰ:行やフェンス本体枚数・枚数・フリー支柱等、paramNameが「数量」以外の行はそのまま残す。
    // 2026-08-05再修正（坂東さん指示）: 「フェンス本体枚数」「枚数」もparametersには書き込まれた
    // ままにする（cadQtyRows側で数量候補として拾うため）が、仕様欄への表示からは除外する
    // （cadQtyRowsが単位「枚」の転記候補として拾うのと役割を分ける：仕様欄には出さない・
    // 数量としては転記できる、という坂東さんの指示通りの使い分け）。区切りもsplitCadParamSegments
    // でカンマ・改行どちらにも対応させた（ifc-viewer.html側の区切り変更に追従）。
    return splitCadParamSegments(params)
      .filter(seg => !/^(数量|フェンス本体枚数|枚数)[：:]/.test(seg))
      .join('\n');
  }

  /* parametersの各項目「ラベル:数値単位」を汎用的にパースして、取得可能な数量・単位をすべて候補として返す
     （「ﾒｰｶｰ:xxx」のような数値で始まらない項目はcadSpec側の情報なのでここでは無視する）
     2026-08-05修正（坂東さん指示）: ifc-viewer.html側のparameters区切りがカンマに変わったことに
     追従し、splitCadParamSegments（カンマ・改行どちらにも対応）で項目分解するよう変更。
     これにより「フェンス本体枚数:5枚」「枚数:3枚」も他の数値項目と同様に数量候補として拾われ、
     単位「枚」のまま転記候補（quRows、buildCadPreviewTreeで1候補=1リーフ行として展開）に載る。 */
  function cadQtyRows(item) {
    const p = item.parameters || '';
    const rows2 = [];
    splitCadParamSegments(p).forEach(line2 => {
      const idx = line2.search(/[：:]/);
      if (idx < 0) return;
      const label = line2.slice(0, idx).trim();
      const rest = line2.slice(idx + 1).trim();
      const m = rest.match(/^([\d.]+)(.*)$/);
      if (!m) return;
      rows2.push({ qty: parseFloat(m[1]), unit: m[2].trim(), label });
    });
    return rows2.length ? rows2 : [{ qty: item.suuryo ?? 0, unit: '個', label: '' }];
  }

  function findAllMasterMatches(name) {
    const needle = (name || '').trim().toLowerCase();
    if (!needle) return [];
    return _cadAllMasterRows.filter(r => {
      if (r.row_type !== 'row' || !r.rikcad_name) return false;
      return r.rikcad_name.split(',').map(s => s.trim().toLowerCase()).includes(needle);
    });
  }

  /* CAD引用データ(_cadItems)とマスタ行(全列)から、マスタのフォルダ階層でグループ化したプレビュー木を作る。
     1つのCAD要素に複数の工事がrikcad_nameで紐づいている場合は、マッチした行ごとに別リーフとして展開する。 */
  function buildCadPreviewTree(cadItems, allMasterRows) {
    const folderByFolderId = new Map();
    allMasterRows.forEach(r => { if (r.row_type !== 'row' && r.folder_id) folderByFolderId.set(r.folder_id, r); });

    const folderNodeByFolderId = new Map();
    const roots = [];
    function ensureFolderNode(folderId) {
      if (folderNodeByFolderId.has(folderId)) return folderNodeByFolderId.get(folderId);
      const row = folderByFolderId.get(folderId);
      const node = { row, children: [], leaves: [] };
      folderNodeByFolderId.set(folderId, node);
      if (row.parent_id && folderByFolderId.has(row.parent_id)) {
        ensureFolderNode(row.parent_id).children.push(node);
      } else {
        roots.push(node);
      }
      return node;
    }

    const leaves = [];
    const looseLeaves = [];
    cadItems.forEach((item, itemIdx) => {
      const quRows = cadQtyRows(item);
      const matches = findAllMasterMatches(item.name);
      quRows.forEach((qu, subIdx) => {
        // 2026-07-28: 引出線名称(item.hikidashi)をleafに配線。以前はCAD JSON側にこの項目が無かったため
        // 未配線のままで実質常に空だったが、送り手側(ifc-viewer.html/ifc-extract.js)がhikidashiフィールドを
        // 出力するようになったため、ここでleaf.hikidashiとして受け渡す（下の「採用」トグルUIは変更不要）
        // 2026-08-04追加（坂東さん指示）: item.kakaku（ifc-viewer.htmlの価格検索で反映した金額）も
        // leafへ配線する。マスタ未マッチの明細のみ「定価」列へそのまま反映する（下記applyCadImport/
        // _cadLeafRowHtml参照）。金額は坂東さん指示により数量で割った単価換算は行わず、金額のまま。
        const base = { itemIdx, subIdx, qty: qu.qty, unit: qu.unit, qtyLabel: qu.label, cadName: item.name || '', spec: cadSpec(item), hikidashi: item.hikidashi || '', kakaku: item.kakaku != null ? Number(item.kakaku) : 0 };
        if (matches.length === 0) {
          const leaf = { ...base, matchedRow: null };
          looseLeaves.push(leaf); leaves.push(leaf);
          return;
        }
        matches.forEach(m => {
          const leaf = { ...base, matchedRow: m };
          leaves.push(leaf);
          if (m.parent_id && folderByFolderId.has(m.parent_id)) {
            ensureFolderNode(m.parent_id).leaves.push(leaf);
          } else {
            looseLeaves.push(leaf);
          }
        });
      });
    });

    return { roots, looseLeaves, leaves };
  }

  /* マッチしたマスタ行の単価(cost/craftsman/bone/customer)から、CAD側の数量で見積もった金額・粗利をプレビュー計算する
     （import後の反映値と同じ式。単価⇔掛率等の逆算は行わず、金額の表示のみ） */
  function cadPreviewAmounts(qty, m) {
    if (!m) return {};
    const cost = m.unit_price != null ? Number(m.unit_price) : NaN;
    const craftsman = m.craftsman_unit_price != null ? Number(m.craftsman_unit_price) : NaN;
    const bone = m.bone_unit_price != null ? Number(m.bone_unit_price) : NaN;
    const uprice = m.customer_unit_price != null ? Number(m.customer_unit_price) : NaN;
    const costAmount = !isNaN(cost) ? Math.round(qty * cost) : '';
    const craftsmanAmount = !isNaN(craftsman) ? Math.round(qty * craftsman) : '';
    const boneAmount = !isNaN(bone) ? Math.round(qty * bone) : '';
    const amount = !isNaN(uprice) ? Math.round(qty * uprice) : '';
    const costTotal = (costAmount === '' ? 0 : costAmount) + (craftsmanAmount === '' ? 0 : craftsmanAmount) + (boneAmount === '' ? 0 : boneAmount);
    const interest = amount !== '' ? (amount - costTotal) : '';
    const interestRate = (amount !== '' && amount !== 0) ? ((interest / amount) * 100).toFixed(1) : '';
    return { costAmount, craftsmanAmount, boneAmount, amount, interest, interestRate };
  }

  async function loadCadFile(idx) {
    const f = _cadFiles[idx];
    const isIfc = (f.name || '').toLowerCase().endsWith('.ifc');
    document.getElementById('cadTitle').textContent = 'CADから引用';
    document.getElementById('cadBody').innerHTML = isIfc
      ? '<div style="padding:28px;text-align:center;color:#999;">IFCを解析中...（ファイルサイズによっては時間がかかります）</div>'
      : '<div style="padding:28px;text-align:center;color:#999;">読み込み中...</div>';
    document.getElementById('cadFooter').innerHTML = '';
    try {
      const r = await fetch(`${STORAGE_BASE}/${f.storage_path}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      if (isIfc) {
        // JSONルートとは別に、IFCを直接読んで同じフラット配列(file/suuryo/kakaku/name/type/parameters)を得る
        const buffer = await r.arrayBuffer();
        const { extractIfcItems } = await import('./ifc-extract.js');
        _cadItems = await extractIfcItems(buffer, f.name);
      } else {
        const text = await r.text();
        const cleaned = text.replace(/,\s*([}\]])/g, '$1');
        const data = JSON.parse(cleaned);
        _cadItems = data.items || (Array.isArray(data) ? data : []);
      }
      if (!_cadItems.length) throw new Error('データが空です');
      renderCadImportTable();
    } catch(e) {
      document.getElementById('cadBody').innerHTML = `<div style="padding:20px;color:#e02020;">読み込み失敗: ${escHtml(e.message)}</div>`;
      document.getElementById('cadFooter').innerHTML = '<button class="pbtn" onclick="closeCadOverlay()">閉じる</button>';
    }
  }

    );
  }

  /* ===== 合算・小計（「CADから引用」プレビュー専用。オーナー確定仕様 2026-07-24 / cad-import-koji-select-spec.md、
     2026-07-28に合算実行方式を改訂）=====
     名称+単位が一致する明細行を「合算」候補としてグループ化する（グループの視覚的な色分けは2026-07-28に廃止済み）。
     対象行はチェックボックスで選択するが、小計行の生成・再計算・削除は自動では行わず、画面下部の「合算」ボタン
     （_cadApplyAllSubtotals）を押した時点でのみ実行する。押すたびに、その時点でチェックされている行を対象に
     小計行を作り直し、「チェックされている行のうち表示順で一番下の行」の直後に1箇所だけ挿入する
     （チェック状況によって挿入位置が変わりうるため、_cadUpdateSubtotalは既存の小計行を一旦削除してから
     作り直す設計にしている）。合算チェックが2件未満に戻った状態で「合算」ボタンを押すと、既存の小計行は
     削除されたまま再生成されない。小計行はrows配列に存在しない合成行であり、applyCadImport()の対象には
     ならない（.cad-chk=引用チェックを持たないためcheckedになりようがなく、_cadPreviewLeavesにも登録しない）。 */

  /* リーフ行の表示名解決（マスタ一致ならmatchedRow.name、無ければCAD側のRIKCAD材料名）。
     _cadAssignGroups（グループ化キー）・_cadSubtotalRowHtml（小計行の名称表示）・applyCadImport（挿入名称）で共通利用する。 */
  function _cadLeafDisplayName(leaf) {
    return leaf.matchedRow ? (leaf.matchedRow.name || '') : (leaf.cadName || '');
  }

  /* リーフ行の安定キー（バグ修正: saveKojiLinks()参照。debug-log/2026-07-28-koji-select-merge-reset.md）。
     _cadGroupId/leafIdxはrenderCadImportTable()の再描画のたびに作り直されるため、再描画後に「同じ行」を
     見つけて合算チェック状態を復元する用途には使えない。CAD明細内の位置(itemIdx+subIdx)とマスタ引当結果
     (matchedRow.id、未引当ならnull)の組は、工事選択の保存でrikcad_nameが変わっても再描画前後で不変
     （名称そのものを変更する操作ではないため）なので、これを安定キーとして採用する。 */
  function _cadLeafStableKey(leaf) {
    return `${leaf.itemIdx}/${leaf.subIdx}/${leaf.matchedRow ? leaf.matchedRow.id : 'null'}`;
  }

  /* buildCadPreviewTreeが返すroots/looseLeavesを、_cadFolderRowHtml/_cadLeafRowHtmlが生成するのと同じ順序
     （子フォルダを先に再帰、その後自フォルダ直下のleaves→最後にlooseLeaves）でリーフだけ平坦化する。
     この順序＝画面上の表示順のため、グループ内で最後に現れるリーフ＝「一番下の行」の判定に使う。 */
  function _cadFlattenLeavesInOrder(roots, looseLeaves) {
    const out = [];
    function walkFolder(node) {
      node.children.forEach(walkFolder);
      node.leaves.forEach(l => out.push(l));
    }
    roots.forEach(walkFolder);
    looseLeaves.forEach(l => out.push(l));
    return out;
  }

  /* 表示順に並んだリーフ配列から「名称+単位」キーでグループを作り、各リーフに
     _cadGroupId/_cadGroupAnchor（グループ内で一番下の行か）を書き込む。 */
  function _cadAssignGroups(orderedLeaves) {
    const groups = new Map();
    orderedLeaves.forEach(leaf => {
      const key = _cadLeafDisplayName(leaf) + '' + (leaf.unit || '');
      leaf._cadGroupId = null; leaf._cadGroupAnchor = false;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(leaf);
    });
    let groupSeq = 0;
    groups.forEach(members => {
      if (members.length < 2) return; // 1件しかないグループは合算チェックを出さない
      const groupId = 'cadgrp' + (groupSeq++);
      members.forEach((leaf, i) => {
        leaf._cadGroupId = groupId;
        leaf._cadGroupAnchor = (i === members.length - 1);
      });
    });
  }

  /* 小計行のHTML断片を返すだけの関数（DOM挿入は呼び出し側=_cadUpdateSubtotalが行う）。
     2026-07-28〜: アンカー行＝「押下時点でチェックされている行のうち表示順で一番下の行」（_cadUpdateSubtotal側で
     都度決定）。data-parentはアンカー行と同じ値を持たせ、フォルダの折りたたみ(_cadTreeToggleChildren)が
     アンカー行と同期して小計行にも及ぶようにする。 */
  function _cadSubtotalRowHtml(anchorLeaf, depth, parentFolderId) {
    const indent = depth * 14 + 4;
    const name = _cadLeafDisplayName(anchorLeaf);
    return `<tr class="r-subtotal cad-subtotal-hidden" data-subtotal-group="${anchorLeaf._cadGroupId}"${parentFolderId != null ? ` data-parent="${parentFolderId}"` : ''}>` +
      `<td class="ac fx fx0 w-arrow"></td>` +
      `<td class="ac fx fx1 w-check"><input type="checkbox" class="cad-subtotal-chk" data-group="${anchorLeaf._cadGroupId}"></td>` +
      `<td class="fx fxM w-merge"></td>` +
      `<td class="ac fx fxK w-koji"><span class="subtotal-label">合算</span></td>` +
      `<td class="al fx fx2 w-name"><div class="name-wrap" style="padding-left:${indent}px;"><span class="name-text">${escHtml(name)}</span></div></td>` +
      `<td class="al fx fx3 w-spec"></td>` +
      `<td class="al fx fx4 w-rikcad"></td>` +
      `<td class="al fx fxH w-hikidashi"></td>` +
      `<td class="ar fx fx5 w-qty" data-subtotal-qty></td>` +
      `<td class="ac fx fx6 w-unit">${escHtml(anchorLeaf.unit || '')}</td>` +
      `<td class="ar fx fx7 w-price"></td>` +
      _cadGroupCellsHtml(null) +
      '</tr>';
  }

  /* グループの合算値（数量合計・共通の客出し単価・金額）を計算する共通関数。
     画面表示(_cadUpdateSubtotal)とINSERT用データ生成(applyCadImport)の両方から呼び、
     ロジックの重複・食い違いを防ぐ（オーナー指示 2026-07-27）。
     チェック済みメンバーが2件未満（合算不成立）の場合はnullを返す。 */
  function _cadComputeSubtotal(groupId) {
    const table = document.getElementById('cadMasterTable');
    if (!table || !groupId) return null;
    const mergeChks = [...table.querySelectorAll(`.cad-merge-chk[data-group="${groupId}"]:checked`)];
    const checkedLeafIdxs = mergeChks.map(c => parseInt(c.dataset.leafIdx, 10));
    const checkedLeaves = checkedLeafIdxs.map(i => _cadPreviewLeaves[i]).filter(Boolean);
    if (checkedLeaves.length < 2) return null;

    const qtySumRaw = checkedLeaves.reduce((s, l) => s + (Number(l.qty) || 0), 0);
    const qtySum = Math.round(qtySumRaw * 1000) / 1000; // 浮動小数の誤差(0.1+0.2等)を吸収

    // 2026-08-05修正（坂東さん指示「合算対象となった元要素の単価も引き継いでください」）:
    // 従来は「チェック済みメンバーのうち最初に単価を持つもの」を1件だけ採用し、その単価を
    // 合計数量にそのまま掛けていた（uprice * qtySum）。これだとメンバー間で単価が異なる場合
    // （同じ名称＋単位でもマスタの引当行が違う等）に金額が不正確になる。各メンバー自身の単価×
    // そのメンバー自身の数量、をメンバーごとに積み上げて金額を算出する方式に変更した。
    // 表示・保存用の単価（列が1つしか無いため）は「金額÷合計数量」の実効単価とし、全メンバーが
    // 同じ単価であれば従来と同じ値になる。
    // 2026-08-05再修正（坂東さん指摘、011.jpg）: 客出し単価(uprice)だけでなく、問屋材仕入れ単価
    // (cost=matchedRow.unit_price)も合算後に反映されていなかった（cadPreviewAmountsが個別行では
    // 計算しているのに、_cadComputeSubtotalはuprice/amountしか計算していなかったのが原因）。
    // 同じ考え方（メンバーごとの単価×数量を積み上げ→実効単価=金額÷合計数量）を、問屋材仕入れ
    // （cost）・職人手間（craftsman）・骨材料等（bone）にも適用し、cadPreviewAmountsと同じ
    // 「costTotal（3種の金額合計）・粗利額(interest)・粗利率(interestRate)」も算出するようにした。
    function accumulate(getPrice) {
      let sum = 0, any = false;
      for (const l of checkedLeaves) {
        const price = getPrice(l.matchedRow);
        if (price != null) any = true;
        sum += (price || 0) * (Number(l.qty) || 0);
      }
      sum = Math.round(sum);
      return { amount: sum, unitPrice: (any && qtySum) ? sum / qtySum : null };
    }
    const costR = accumulate(m => (m && m.unit_price != null) ? Number(m.unit_price) : null);
    const craftsmanR = accumulate(m => (m && m.craftsman_unit_price != null) ? Number(m.craftsman_unit_price) : null);
    const boneR = accumulate(m => (m && m.bone_unit_price != null) ? Number(m.bone_unit_price) : null);
    const upriceR = accumulate(m => (m && m.customer_unit_price != null) ? Number(m.customer_unit_price) : null);
    const costTotal = costR.amount + craftsmanR.amount + boneR.amount;
    const interest = upriceR.amount - costTotal;
    const interestRate = upriceR.amount ? Math.round((interest / upriceR.amount) * 1000) / 10 : null;
    const nameLeaf = checkedLeaves.find(l => l.matchedRow) || checkedLeaves[0];

    return {
      checkedLeaves, checkedLeafIdxs, qtySum,
      cost: costR.unitPrice, costAmount: costR.amount,
      craftsman: craftsmanR.unitPrice, craftsmanAmount: craftsmanR.amount,
      bone: boneR.unitPrice, boneAmount: boneR.amount,
      uprice: upriceR.unitPrice, amount: upriceR.amount,
      interest, interestRate,
      name: _cadLeafDisplayName(nameLeaf),
      unit: nameLeaf.unit || '',
    };
  }

  /* 「合算」ボタン(_cadApplyAllSubtotals)からのみ呼ばれる（2026-07-28: 合算チェックのchangeイベントによる
     自動集計はオーナー指示で廃止。押下時点でチェックされている行を対象に小計行を作り直す方式に変更）。
     既存の小計行があれば挿入位置ごと一旦削除し、チェック済みメンバーが2件以上あれば「その時点でチェックされて
     いる行のうち表示順で一番下の行」の直後に新しい小計行を挿入し直す（トグルではなく毎回作り直す設計。
     チェックの組み合わせ次第で「一番下の行」自体が変わりうるため）。1件以下ならそのまま削除された状態で終わる
     （＝合算不成立。小計の引用チェック(.cad-subtotal-chk)も行ごと消えるため、個別行の引用チェック無効化を
     _cadSyncSubtotalExclusivityで復元する）。 */
  function _cadUpdateSubtotal(groupId) {
    const table = document.getElementById('cadMasterTable');
    if (!table || !groupId) return;

    const existingRow = table.querySelector(`tr[data-subtotal-group="${groupId}"]`);
    const wasSubtotalChecked = !!(existingRow && existingRow.querySelector('.cad-subtotal-chk')?.checked);
    if (existingRow) existingRow.remove();

    const data = _cadComputeSubtotal(groupId);
    if (!data) {
      // 合算不成立（チェック済み2件未満）: 小計行なし。直前まで引用チェックがONだった場合は排他制御を解除する
      _cadSyncSubtotalExclusivity(groupId);
      return;
    }

    // 挿入位置: チェック済みメンバーのうち表示順（leafIdx）で一番大きい＝一番下の行の直後
    const maxIdx = Math.max(...data.checkedLeafIdxs);
    const anchorLeaf = _cadPreviewLeaves[maxIdx];
    const anchorTr = table.querySelector(`tr[data-id="cad-leaf-${maxIdx}"]`);
    if (!anchorLeaf || !anchorTr) return;

    anchorTr.insertAdjacentHTML('afterend', _cadSubtotalRowHtml(anchorLeaf, anchorLeaf._cadDepth || 0, anchorLeaf._cadParentFolderId));
    const row = table.querySelector(`tr[data-subtotal-group="${groupId}"]`);
    if (!row) return;
    row.classList.remove('cad-subtotal-hidden');
    row.style.display = anchorTr.style.display; // アンカー行が折りたたみ中なら小計行も同じ表示状態にする

    const qtyCell = row.querySelector('.w-qty');
    const upriceCell = row.querySelector('[data-field="uprice"]');
    const amountCell = row.querySelector('[data-field="amount"]');
    if (qtyCell) qtyCell.textContent = esc(data.qtySum);
    if (upriceCell) upriceCell.textContent = esc(fmt(data.uprice || 0));
    if (amountCell) amountCell.textContent = esc(fmt(data.amount));
    // 2026-08-05追加（坂東さん指摘、011.jpg）: 問屋材仕入れ・職人手間・骨材料等・粗利も
    // 客出し単価/金額と同じ要領でセルへ反映する（_cadGroupCellsHtmlが生成するdata-field属性で参照）
    const costCell = row.querySelector('[data-field="cost"]');
    const costAmountCell = row.querySelector('[data-field="costAmount"]');
    const craftsmanCell = row.querySelector('[data-field="craftsman"]');
    const craftsmanAmountCell = row.querySelector('[data-field="craftsmanAmount"]');
    const boneCell = row.querySelector('[data-field="bone"]');
    const boneAmountCell = row.querySelector('[data-field="boneAmount"]');
    const interestCell = row.querySelector('[data-field="interest"]');
    const interestRateCell = row.querySelector('[data-field="interestRate"]');
    if (costCell) costCell.textContent = esc(fmt(data.cost || 0));
    if (costAmountCell) costAmountCell.textContent = esc(fmt(data.costAmount));
    if (craftsmanCell) craftsmanCell.textContent = esc(fmt(data.craftsman || 0));
    if (craftsmanAmountCell) craftsmanAmountCell.textContent = esc(fmt(data.craftsmanAmount));
    if (boneCell) boneCell.textContent = esc(fmt(data.bone || 0));
    if (boneAmountCell) boneAmountCell.textContent = esc(fmt(data.boneAmount));
    if (interestCell) interestCell.textContent = esc(fmt(data.interest));
    if (interestRateCell) interestRateCell.textContent = data.interestRate != null ? esc(data.interestRate) + '%' : '';

    if (wasSubtotalChecked) {
      const subtotalChk = row.querySelector('.cad-subtotal-chk');
      if (subtotalChk) subtotalChk.checked = true;
    }
    _cadSyncSubtotalExclusivity(groupId);
  }

  /* 小計行の引用チェック(.cad-subtotal-chk)と、そのグループを構成する個々の明細行の引用チェック(.cad-chk)の
     排他制御。小計をONにした瞬間、その時点で合算チェック済みのメンバーの引用チェックを自動OFF＋disabledにして
     二重計上を防ぐ（元のON/OFF状態は_cadSubtotalAffectedに退避し、OFFに戻した時に復元する）。
     呼び出し元は「合算」ボタン押下時の_cadUpdateSubtotal（小計行の作り直し後に呼ぶ）と、
     小計行自身の.cad-subtotal-chkのchangeイベント（ユーザーが直接ON/OFFした場合）の2箇所
     （2026-07-28〜: 合算チェック(.cad-merge-chk)のchangeイベントからは呼ばれなくなった。自動集計廃止のため）。 */
  function _cadSyncSubtotalExclusivity(groupId) {
    const table = document.getElementById('cadMasterTable');
    if (!table || !groupId) return;
    const subtotalChk = table.querySelector(`.cad-subtotal-chk[data-group="${groupId}"]`);
    const prevAffected = _cadSubtotalAffected.get(groupId) || [];

    if (!subtotalChk || !subtotalChk.checked) {
      prevAffected.forEach(({ idx, prevChecked }) => {
        const cadChk = table.querySelector(`.cad-chk[data-leaf-idx="${idx}"]`);
        if (cadChk) { cadChk.disabled = false; cadChk.checked = prevChecked; }
      });
      _cadSubtotalAffected.delete(groupId);
      return;
    }

    const currentIdxSet = new Set(
      [...table.querySelectorAll(`.cad-merge-chk[data-group="${groupId}"]:checked`)].map(c => c.dataset.leafIdx)
    );
    const prevMap = new Map(prevAffected.map(a => [String(a.idx), a.prevChecked]));

    // 合算対象から外れたメンバーは元の引用チェック状態に復元する
    prevAffected.forEach(({ idx, prevChecked }) => {
      if (!currentIdxSet.has(String(idx))) {
        const cadChk = table.querySelector(`.cad-chk[data-leaf-idx="${idx}"]`);
        if (cadChk) { cadChk.disabled = false; cadChk.checked = prevChecked; }
      }
    });

    // 現在合算対象のメンバーは全て引用チェックを自動OFF＋disabled化する（既にdisabled済みの分は退避値を維持）
    const nextAffected = [];
    currentIdxSet.forEach(idxStr => {
      const cadChk = table.querySelector(`.cad-chk[data-leaf-idx="${idxStr}"]`);
      if (!cadChk) return;
      if (prevMap.has(idxStr)) {
        nextAffected.push({ idx: idxStr, prevChecked: prevMap.get(idxStr) });
      } else {
        nextAffected.push({ idx: idxStr, prevChecked: cadChk.checked });
        cadChk.checked = false;
        cadChk.disabled = true;
      }
    });
    _cadSubtotalAffected.set(groupId, nextAffected);
  }

  /* 「合算」ボタン(cadFooter)から呼ばれる唯一のトリガー（2026-07-28〜: 自動集計は廃止したため、小計行の
     追加・再計算・削除はこのボタン経由の_cadUpdateSubtotalでのみ発生する）。画面上に存在する全data-group値に
     対してまとめて処理する。 */
  function _cadApplyAllSubtotals() {
    const table = document.getElementById('cadMasterTable');
    if (!table) return;
    const groupIds = new Set();
    table.querySelectorAll('.cad-merge-chk[data-group]').forEach(c => groupIds.add(c.dataset.group));
    groupIds.forEach(g => _cadUpdateSubtotal(g));
  }

  /* 折りたたみ（−／＋）: テーブルにfold-<group>クラスを付け外しするだけのCSSトグル */
  function cadToggleFold(group) {
    document.getElementById('cadMasterTable')?.classList.toggle('fold-' + group);
  }
  function kojiToggleFold(group) {
    document.getElementById('kojiMasterTable')?.classList.toggle('fold-' + group);
  }

  /* ツリー展開・折りたたみ（表示のみ。buildCadPreviewTree/buildKojiMasterTreeが作る木構造はrenderのたびに作り直すため、
     選択状態やデータ取得ロジックには一切影響しない） */
  function _cadTreeToggleChildren(rootEl, id, collapse) {
    if (!rootEl) return;
    document.querySelectorAll('#' + rootEl.id + ' tr[data-parent="' + String(id).replace(/"/g, '\\"') + '"]').forEach(tr => {
      tr.style.display = collapse ? 'none' : '';
      const childId = tr.dataset.id;
      if (collapse) { if (childId) _cadTreeToggleChildren(rootEl, childId, true); }
      else if (!tr.classList.contains('collapsed')) { if (childId) _cadTreeToggleChildren(rootEl, childId, false); }
    });
  }

  function _cadFolderRowHtml(node, depth, parentFolderId) {
    const folderId = node.row.folder_id;
    const indent = depth * 14 + 4;
    let html = `<tr class="${depth === 1 ? 'r-cat' : 'r-sub'}" data-id="${folderId}"${parentFolderId != null ? ` data-parent="${parentFolderId}"` : ''}>`;
    html += `<td class="ac fx fx0 w-arrow"><span class="arrow" data-toggle="${folderId}"></span></td>`;
    html += `<td class="fx fx1 w-check"></td>`;
    html += `<td class="fx fxM w-merge"></td>`;
    html += `<td class="fx fxK w-koji"></td>`;
    html += `<td class="al fx fx2 w-name"><div class="name-wrap" style="padding-left:${indent}px;"><span class="fic">📁</span><span class="bold-text">${escHtml(node.row.name || '')}</span></div></td>`;
    html += `<td class="al fx fx3 w-spec"></td>`;
    html += `<td class="al fx fx4 w-rikcad"></td>`;
    html += `<td class="al fx fxH w-hikidashi"></td>`;
    html += `<td class="ar fx fx5 w-qty"></td>`;
    html += `<td class="ac fx fx6 w-unit"></td>`;
    html += `<td class="ar fx fx7 w-price"></td>`;
    html += _cadGroupCellsHtml(null);
    html += '</tr>';
    node.children.forEach(c => { html += _cadFolderRowHtml(c, depth + 1, folderId); });
    node.leaves.forEach(l => { html += _cadLeafRowHtml(l, depth + 1, folderId); });
    return html;
  }

  function _cadLeafRowHtml(leaf, depth, parentFolderId) {
    const idx = _cadPreviewLeaves.length;
    _cadPreviewLeaves.push(leaf);
    // 「合算」ボタン押下時、この行がグループ内の合算対象の一番下になった場合に小計行を同じ深さ・
    // 同じ折りたたみ階層で挿入し直せるよう、レンダリング時のdepth/parentFolderIdを保持しておく
    // （2026-07-28〜: 小計行の挿入位置がチェック状況で動的に変わるため、_cadUpdateSubtotal側で必要）。
    leaf._cadDepth = depth;
    leaf._cadParentFolderId = parentFolderId;
    const leafId = 'cad-leaf-' + idx;
    const m = leaf.matchedRow;
    const amt = cadPreviewAmounts(leaf.qty, m);
    const indent = depth * 14 + 4;
    const nameHtml = m
      ? `<span class="tree">├</span><span class="name-text">${escHtml(m.name || '')}</span>`
      : `<span class="tree">├</span><span class="name-text" style="color:#999;font-style:italic;">${escHtml(leaf.cadName)}（未登録）</span>`;
    const qtyHtml = `${esc(leaf.qty)}${leaf.qtyLabel ? `<br><span style="font-size:9px;color:#999;">${escHtml(leaf.qtyLabel)}</span>` : ''}`;
    // 引出線名称: 2026-07-28〜 送り手側(ifc-viewer.html/ifc-extract.js)がhikidashiフィールドを出力するようになり、
    // buildCadPreviewTree側でもleaf.hikidashiへの配線を追加済み。値が無い（RIKCAD_PSET未設定等）の場合は
    // 引き続き空文字になり、「採用」ボタン自体を表示しない（既存の空値時挙動を維持）
    const hikidashiName = leaf.hikidashi || '';
    const hikidashiHtml = hikidashiName
      ? `<span class="hikidashi-cell"><span class="hikidashi-text" title="${escHtml(hikidashiName)}">${escHtml(hikidashiName)}</span><button type="button" class="btn-hikidashi" data-hikidashi-idx="${idx}">採用</button></span>`
      : '';

    const mergeCellHtml = leaf._cadGroupId
      ? `<td class="ac fx fxM w-merge"><input type="checkbox" class="cad-merge-chk" data-leaf-idx="${idx}" data-group="${leaf._cadGroupId}"></td>`

  /* 工事種別（master_id）・キーワードで_cadAllMasterRowsを絞り込む。
     フォルダ行(row_type!=='row')は常に残す（マッチした明細行の祖先を辿れるようにするため）。
     絞り込み後にツリーを組むと空になったフォルダが残るため、_kojiPruneEmptyFoldersで別途間引く。 */
  function _kojiFilterMasterRows(masterId, keyword) {
    const kw = (keyword || '').trim().toLowerCase();
    return _cadAllMasterRows.filter(r => {
      if (masterId && String(r.master_id) !== String(masterId)) return false;
      if (r.row_type !== 'row') return true;
      if (!kw) return true;
      const name = (r.name || '').toLowerCase();
      const rikcadName = (r.rikcad_name || '').toLowerCase();
      return name.includes(kw) || rikcadName.includes(kw);
    });
  }

  /* buildKojiMasterTreeが組んだ木から、子・明細のどちらも持たないフォルダノードを再帰的に除去する */
  function _kojiPruneEmptyFolders(nodes) {
    const kept = [];
    nodes.forEach(node => {
      node.children = _kojiPruneEmptyFolders(node.children);
      if (node.children.length > 0 || node.leaves.length > 0) kept.push(node);
    });
    return kept;
  }

  /* master_rowsをフォルダ階層(cat/subcat)でグループ化した木を作る（buildCadPreviewTreeのフォルダ構築部分と同じ考え方だが、
     工事選択画面は「マスタ全行を一覧して選ばせる」画面のためCAD側のitem/matchesは扱わない） */
  function buildKojiMasterTree(allMasterRows) {
    const folderByFolderId = new Map();
    allMasterRows.forEach(r => { if (r.row_type !== 'row' && r.folder_id) folderByFolderId.set(r.folder_id, r); });

    const folderNodeByFolderId = new Map();
    const roots = [];
    function ensureFolderNode(folderId) {
      if (folderNodeByFolderId.has(folderId)) return folderNodeByFolderId.get(folderId);
      const row = folderByFolderId.get(folderId);
      const node = { row, children: [], leaves: [] };
      folderNodeByFolderId.set(folderId, node);
      if (row.parent_id && folderByFolderId.has(row.parent_id)) {
        ensureFolderNode(row.parent_id).children.push(node);
      } else {
        roots.push(node);
      }
      return node;
    }

    const looseLeaves = [];
    allMasterRows.filter(r => r.row_type === 'row').forEach(r => {
      if (r.parent_id && folderByFolderId.has(r.parent_id)) {
        ensureFolderNode(r.parent_id).leaves.push(r);
      } else {
        looseLeaves.push(r);
      }
    });
    return { roots, looseLeaves };
  }

    html += _cadGroupCellsHtml(null);
    html += '</tr>';
    node.children.forEach(c => { html += _kojiFolderRowHtml(c, depth + 1, folderId); });
    node.leaves.forEach(r => { html += _kojiLeafRowHtml(r, depth + 1, folderId); });
    return html;
